<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  
  <!-- Monster v2 beacon: the Claude crab's clawd-working-beacon-v2.svg (same scene and timing) with the monster's body, eyes and mittens. -->
  <defs>
    <style>
      .bob { animation: bob 2s infinite step-end; }
      .eyes { animation: eyes 2s infinite step-end; }
      .tbr { animation: tbr 2s infinite step-end; }
      .tdm { animation: tdm 2s infinite step-end; }
      .w0 { animation: w0 2s infinite step-end; }
      .w1 { animation: w1 2s infinite step-end; }
      .w2 { animation: w2 2s infinite step-end; }
      .w3 { animation: w3 2s infinite step-end; }
      .w4 { animation: w4 2s infinite step-end; }
      .w5 { animation: w5 2s infinite step-end; }
      .w6 { animation: w6 2s infinite step-end; }
      .w7 { animation: w7 2s infinite step-end; }
      .w8 { animation: w8 2s infinite step-end; }
      .w9 { animation: w9 2s infinite step-end; }
      .w10 { animation: w10 2s infinite step-end; }
      .w11 { animation: w11 2s infinite step-end; }
      .w12 { animation: w12 2s infinite step-end; }
      .w13 { animation: w13 2s infinite step-end; }
      .w14 { animation: w14 2s infinite step-end; }
      .w15 { animation: w15 2s infinite step-end; }
      @keyframes bob {
        0.0% { transform: translate(0px, 1px); }
        6.25% { transform: translate(0px, 0px); }
        25.0% { transform: translate(0px, 1px); }
        31.25% { transform: translate(0px, 0px); }
        50.0% { transform: translate(0px, 1px); }
        56.25% { transform: translate(0px, 0px); }
        75.0% { transform: translate(0px, 1px); }
        81.25% { transform: translate(0px, 0px); }
      }
      @keyframes eyes {
        0.0% { transform: translate(0px, 0px); }
        6.25% { transform: translate(0px, -1px); }
        18.75% { transform: translate(0px, 0px); }
        31.25% { transform: translate(0px, -1px); }
        43.75% { transform: translate(0px, 0px); }
        56.25% { transform: translate(0px, -1px); }
        68.75% { transform: translate(0px, 0px); }
        81.25% { transform: translate(0px, -1px); }
        93.75% { transform: translate(0px, 0px); }
      }
      @keyframes tbr {
        0.0% { opacity: 1; }
        6.25% { opacity: 0; }
        25.0% { opacity: 1; }
        31.25% { opacity: 0; }
        50.0% { opacity: 1; }
        56.25% { opacity: 0; }
        75.0% { opacity: 1; }
        81.25% { opacity: 0; }
      }
      @keyframes tdm {
        0.0% { opacity: 0; }
        12.5% { opacity: 1; }
        25.0% { opacity: 0; }
        37.5% { opacity: 1; }
        50.0% { opacity: 0; }
        62.5% { opacity: 1; }
        75.0% { opacity: 0; }
        87.5% { opacity: 1; }
      }
      @keyframes w0 {
        0.0% { opacity: 1; }
        6.25% { opacity: 0; }
      }
      @keyframes w1 {
        0.0% { opacity: 0; }
        6.25% { opacity: 1; }
        12.5% { opacity: 0; }
      }
      @keyframes w2 {
        0.0% { opacity: 0; }
        12.5% { opacity: 1; }
        18.75% { opacity: 0; }
      }
      @keyframes w3 {
        0.0% { opacity: 0; }
        18.75% { opacity: 1; }
        25.0% { opacity: 0; }
      }
      @keyframes w4 {
        0.0% { opacity: 0; }
        25.0% { opacity: 1; }
        31.25% { opacity: 0; }
      }
      @keyframes w5 {
        0.0% { opacity: 0; }
        31.25% { opacity: 1; }
        37.5% { opacity: 0; }
      }
      @keyframes w6 {
        0.0% { opacity: 0; }
        37.5% { opacity: 1; }
        43.75% { opacity: 0; }
      }
      @keyframes w7 {
        0.0% { opacity: 0; }
        43.75% { opacity: 1; }
        50.0% { opacity: 0; }
      }
      @keyframes w8 {
        0.0% { opacity: 0; }
        50.0% { opacity: 1; }
        56.25% { opacity: 0; }
      }
      @keyframes w9 {
        0.0% { opacity: 0; }
        56.25% { opacity: 1; }
        62.5% { opacity: 0; }
      }
      @keyframes w10 {
        0.0% { opacity: 0; }
        62.5% { opacity: 1; }
        68.75% { opacity: 0; }
      }
      @keyframes w11 {
        0.0% { opacity: 0; }
        68.75% { opacity: 1; }
        75.0% { opacity: 0; }
      }
      @keyframes w12 {
        0.0% { opacity: 0; }
        75.0% { opacity: 1; }
        81.25% { opacity: 0; }
      }
      @keyframes w13 {
        0.0% { opacity: 0; }
        81.25% { opacity: 1; }
        87.5% { opacity: 0; }
      }
      @keyframes w14 {
        0.0% { opacity: 0; }
        87.5% { opacity: 1; }
        93.75% { opacity: 0; }
      }
      @keyframes w15 {
        0.0% { opacity: 0; }
        93.75% { opacity: 1; }
      }
    </style>

    <!-- ===== rig: shared Clawd v2 parts, identical in every clawd-*-v2.svg (see clawd-static-base-v2.svg) ===== -->
    <!-- ground shadow, two translucent rows -->
    <g id="shadow">
      <path fill="#000000" fill-opacity="0.3" d="M3 30h24v1h-24z"/>
      <path fill="#000000" fill-opacity="0.15" d="M6 31h18v1h-18z"/>
    </g>
    <!-- leg 1 of 4 (drawn tall; the top is hidden behind the body) -->
    <g id="leg1"></g>
    <!-- leg 2 of 4 (drawn tall; the top is hidden behind the body) -->
    <g id="leg2"></g>
    <!-- leg 3 of 4 (drawn tall; the top is hidden behind the body) -->
    <g id="leg3"></g>
    <!-- leg 4 of 4 (drawn tall; the top is hidden behind the body) -->
    <g id="leg4"></g>
    <!-- body: 1 px outline, light top/left, shade bottom/right, specular dot -->
