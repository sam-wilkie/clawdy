    <!-- ===== props used by this animation ===== -->
    <!-- Steel antenna shaft rising from the head centre (x 14-15), with a 1px outline and a steel highlight. -->
    <g id="antenna"><g transform="translate(0 -10)">
      <path fill="#6B737D" d="M14 6h2v7h-2z"/>
      <path fill="#A9B2BC" d="M14 6h1v7h-1z"/>
      <path fill="#DCE2E8" d="M14 7h1v2h-1z"/>
    </g></g>
    <!-- Blinking tip: a 2x2 red bit with a bright top-left highlight. -->
