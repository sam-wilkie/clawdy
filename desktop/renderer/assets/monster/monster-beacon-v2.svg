      <path fill="#FFA3A6" d="M14 3h1v1h-1z"/>
    </g></g>
    <!-- Tip emission flash (bright when a wave leaves) and dim phase (after), over the base tip. -->
    <g id="tip-bright"><g transform="translate(0 -10)">
      <path fill="#FFC2C4" d="M14 3h2v2h-2z"/>
      <path fill="#FFFFFF" d="M14 3h1v1h-1z"/>
    </g></g>
    <g id="tip-dim"><g transform="translate(0 -10)">
