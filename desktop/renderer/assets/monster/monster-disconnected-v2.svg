<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  
  <!-- Monster v2 disconnected: the Claude crab's clawd-disconnected-v2.svg (same scene and timing) with the monster's body, eyes and mittens. -->
  <defs>
    <style>
      .tilt  { transform-box: fill-box; transform-origin: 50% 100%; animation: tilt 3.2s ease-in-out infinite; }
      .hop   { animation: hop 3.2s ease-out infinite; }
      .badge { animation: float 1.6s steps(1) infinite; }
      .reach { animation: reach 1.6s steps(1) infinite; }
      .zap   { animation: zap 1.6s steps(1) infinite; }
      .bshadow { animation: bshadow 1.6s steps(1) infinite; }
      .q     { animation: q 3.2s steps(1) infinite; }
      .bang  { animation: bang 3.2s steps(1) infinite; }
      /* whole art-pixel moves only: the plug creeps 1px at a time, never touching the socket */
      @keyframes reach {
        0%, 100% { transform: translateX(-3px); }
        15% { transform: translateX(-2px); }
        30% { transform: translateX(-1px); }
        45%, 60% { transform: translateX(0px); }
        75% { transform: translateX(-2px); }
      }
      @keyframes zap   { 0%, 44% { opacity: 0; } 48% { opacity: 1; } 58%, 100% { opacity: 0; } }

      @keyframes tilt {
        0%, 20%, 70%, 100% { transform: rotate(0deg); }
        30%, 60%           { transform: rotate(-5deg); }
      }
      @keyframes hop {
        0%, 80%, 100% { transform: translateY(0); }
        85%           { transform: translateY(-3px); }
        90%           { transform: translateY(0); }
      }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
      @keyframes halo  { 0%, 100% { transform: scale(1); opacity: 0.55; } 50% { transform: scale(1.12); opacity: 0.25; } }
      @keyframes bshadow { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.15; } }
      @keyframes q    { 0% { opacity: 0; } 12% { opacity: 1; } 70% { opacity: 0; } }
      @keyframes bang { 0% { opacity: 0; } 80% { opacity: 1; } 95% { opacity: 0; } }
    </style>

    <!-- ===== v2 rig ===== -->
    <g id="leg1"></g>
    <g id="leg2"></g>
    <g id="leg3"></g>
    <g id="leg4"></g>
    <g id="torso">      <path fill="#5E4B5A" d="M2 8h1v1h-1zM2 9h1v1h-1zM1 10h1v1h-1zM1 11h1v1h-1zM1 12h1v1h-1zM1 13h1v1h-1zM1 14h1v1h-1zM1 15h1v1h-1zM1 16h1v1h-1zM1 17h1v1h-1zM1 18h1v1h-1zM1 19h1v1h-1zM1 20h1v1h-1zM2 21h1v1h-1zM2 22h1v1h-1zM3 23h1v1h-1zM4 24h1v1h-1zM5 25h1v1h-1zM6 26h2v1h-2zM8 27h2v1h-2zM10 28h4v1h-4zM16 28h2v1h-2zM14 29h2v1h-2z"/>
      <path fill="#7C1E2B" d="M14 1h2v1h-2zM10 2h4v1h-4zM16 2h4v1h-4zM8 3h2v1h-2zM20 3h2v1h-2zM6 4h2v1h-2zM22 4h2v1h-2zM5 5h1v1h-1zM24 5h1v1h-1zM4 6h1v1h-1zM25 6h1v1h-1zM3 7h1v1h-1zM26 7h1v1h-1zM27 8h1v1h-1zM27 9h1v1h-1zM28 10h1v1h-1zM28 11h1v1h-1zM28 12h1v1h-1zM28 13h1v1h-1zM28 14h1v1h-1zM28 15h1v1h-1zM28 16h1v1h-1zM28 17h1v1h-1zM28 18h1v1h-1zM28 19h1v1h-1zM28 20h1v1h-1zM27 21h1v1h-1zM27 22h1v1h-1zM26 23h1v1h-1zM25 24h1v1h-1zM24 25h1v1h-1zM22 26h2v1h-2zM20 27h2v1h-2zM18 28h2v1h-2z"/>
      <path fill="#FFFFFF" d="M4 7h1v1h-1zM3 8h1v1h-1zM3 9h1v1h-1zM2 10h1v1h-1zM2 11h1v1h-1zM2 12h1v1h-1zM2 13h1v1h-1zM2 14h1v1h-1zM2 15h1v1h-1zM2 16h1v1h-1zM2 17h1v1h-1zM2 18h1v1h-1z"/>
      <path fill="#F2848D" d="M14 2h1v1h-1zM10 3h4v1h-4zM16 3h3v1h-3zM8 4h2v1h-2zM20 4h1v1h-1zM6 5h2v1h-2zM22 5h1v1h-1zM5 6h1v1h-1z"/>
      <path fill="#F6F1F0" d="M6 6h8v1h-8zM5 7h12v1h-12zM4 8h14v1h-14zM4 9h15v1h-15zM3 10h17v1h-17zM3 11h18v1h-18zM3 12h18v1h-18zM3 13h19v1h-19zM3 14h19v1h-19zM3 15h20v1h-20zM3 16h20v1h-20zM3 17h20v1h-20zM3 18h20v1h-20zM3 19h20v1h-20zM3 20h20v1h-20zM4 21h18v1h-18zM5 22h17v1h-17zM6 23h16v1h-16zM8 24h13v1h-13zM10 25h10v1h-10zM14 26h2v1h-2z"/>
      <path fill="#DE4553" d="M14 3h2v1h-2zM10 4h10v1h-10zM8 5h14v1h-14zM14 6h10v1h-10zM17 7h8v1h-8zM18 8h8v1h-8zM19 9h7v1h-7zM20 10h7v1h-7zM21 11h6v1h-6zM21 12h6v1h-6zM22 13h5v1h-5zM22 14h5v1h-5zM23 15h4v1h-4zM23 16h4v1h-4zM23 17h4v1h-4zM23 18h4v1h-4zM23 19h4v1h-4zM23 20h4v1h-4zM22 21h4v1h-4zM22 22h3v1h-3zM22 23h2v1h-2zM21 24h1v1h-1z"/>
      <path fill="#D9CDD2" d="M2 19h1v1h-1zM2 20h1v1h-1zM3 21h1v1h-1zM3 22h2v1h-2zM4 23h2v1h-2zM5 24h3v1h-3zM6 25h4v1h-4zM20 25h1v1h-1zM8 26h6v1h-6zM16 26h4v1h-4zM10 27h9v1h-9zM14 28h2v1h-2z"/>
      <path fill="#B32F40" d="M15 2h1v1h-1zM19 3h1v1h-1zM21 4h1v1h-1zM23 5h1v1h-1zM24 6h1v1h-1zM25 7h1v1h-1zM26 8h1v1h-1zM26 9h1v1h-1zM27 10h1v1h-1zM27 11h1v1h-1zM27 12h1v1h-1zM27 13h1v1h-1zM27 14h1v1h-1zM27 15h1v1h-1zM27 16h1v1h-1zM27 17h1v1h-1zM27 18h1v1h-1zM27 19h1v1h-1zM27 20h1v1h-1zM26 21h1v1h-1zM25 22h2v1h-2zM24 23h2v1h-2zM22 24h3v1h-3zM21 25h3v1h-3zM20 26h2v1h-2zM19 27h1v1h-1z"/><path fill="#5A2433" d="M11 23h1v1h-1zM18 23h1v1h-1zM12 24h6v1h-6z"/><path fill="#FFFFFF" d="M13 25h1v1h-1zM16 25h1v1h-1z"/></g>
    <g id="arm-l"><path fill="#5E4B5A" d="M-1 16h5v1h-5zM-2 17h1v1h-1zM4 17h1v1h-1zM-2 18h1v1h-1zM4 18h2v1h-2zM-2 19h1v1h-1zM3 19h1v1h-1zM5 19h1v1h-1zM-2 20h1v1h-1zM5 20h1v1h-1zM-2 21h1v1h-1zM4 21h1v1h-1zM-1 22h5v1h-5z"/><path fill="#F6F1F0" d="M-1 17h2v1h-2zM-1 18h4v1h-4zM0 19h3v1h-3zM0 20h4v1h-4zM1 21h3v1h-3z"/><path fill="#FFFFFF" d="M1 17h3v1h-3zM3 18h1v1h-1zM4 19h1v1h-1zM4 20h1v1h-1z"/><path fill="#D9CDD2" d="M-1 19h1v1h-1zM-1 20h1v1h-1zM-1 21h2v1h-2z"/></g>
    <g id="arm-r"><path fill="#7C1E2B" d="M26 16h5v1h-5zM25 17h1v1h-1zM31 17h1v1h-1zM24 18h2v1h-2zM31 18h1v1h-1zM24 19h1v1h-1zM26 19h1v1h-1zM31 19h1v1h-1zM24 20h1v1h-1zM31 20h1v1h-1zM25 21h1v1h-1zM31 21h1v1h-1zM26 22h5v1h-5z"/><path fill="#F2848D" d="M26 17h3v1h-3zM26 18h1v1h-1zM25 19h1v1h-1zM25 20h1v1h-1z"/><path fill="#DE4553" d="M29 17h2v1h-2zM27 18h4v1h-4zM27 19h3v1h-3zM26 20h4v1h-4zM26 21h3v1h-3z"/><path fill="#B32F40" d="M30 19h1v1h-1zM30 20h1v1h-1zM29 21h2v1h-2z"/></g>
    <!-- eyes looking up-right at the badge -->
    <g id="eyes-ur"><path fill="#DE4553" d="M6 14h5v1h-5zM5 15h1v1h-1zM11 15h1v1h-1zM5 16h1v1h-1zM11 16h1v1h-1zM5 17h1v1h-1zM11 17h1v1h-1zM5 18h1v1h-1zM11 18h1v1h-1zM5 19h1v1h-1zM11 19h1v1h-1zM5 20h1v1h-1zM11 20h1v1h-1zM6 21h5v1h-5z"/><path fill="#2A1A22" d="M6 15h5v1h-5zM6 16h5v1h-5zM6 17h5v1h-5zM6 18h5v1h-5zM6 19h5v1h-5zM6 20h5v1h-5z"/><path fill="#B9AAB2" d="M18 14h5v1h-5zM17 15h1v1h-1zM23 15h1v1h-1zM17 16h1v1h-1zM23 16h1v1h-1zM17 17h1v1h-1zM23 17h1v1h-1zM17 18h1v1h-1zM23 18h1v1h-1zM17 19h1v1h-1zM23 19h1v1h-1zM17 20h1v1h-1zM23 20h1v1h-1zM18 21h5v1h-5z"/><path fill="#2A1A22" d="M18 15h5v1h-5zM18 16h5v1h-5zM18 17h5v1h-5zM18 18h5v1h-5zM18 19h5v1h-5zM18 20h5v1h-5z"/><path fill="#B9AAB2" d="M12 12h5v1h-5zM11 13h1v1h-1zM17 13h1v1h-1zM11 14h1v1h-1zM17 14h1v1h-1zM11 15h1v1h-1zM17 15h1v1h-1zM11 16h1v1h-1zM17 16h1v1h-1zM11 17h1v1h-1zM17 17h1v1h-1zM11 18h1v1h-1zM17 18h1v1h-1zM12 19h5v1h-5z"/><path fill="#2A1A22" d="M12 13h5v1h-5zM12 14h5v1h-5zM12 15h5v1h-5zM12 16h5v1h-5zM12 17h5v1h-5zM12 18h5v1h-5z"/><path fill="#FFFFFF" d="M8 15h2v1h-2zM8 16h2v1h-2zM10 18h1v1h-1z"/><path fill="#FFFFFF" d="M20 15h2v1h-2zM20 16h2v1h-2zM22 18h1v1h-1z"/><path fill="#FFFFFF" d="M14 13h2v1h-2zM14 14h2v1h-2zM16 16h1v1h-1z"/></g>
    <!-- "?" 4x6 -->
    <g id="qmark" fill="#6B3122"><g transform="translate(0 -10)">
      <path d="M1 0h2v1h-2zM0 1h1v1h-1zM3 1h1v2h-1zM2 3h1v1h-1zM1 4h1v1h-1zM1 6h1v1h-1z"/>
    </g></g>
    <!-- "!" 2x7 -->
    <g id="bang" fill="#3D8BFD"><g transform="translate(0 -10)"><path d="M0 0h2v4h-2zM0 5h2v2h-2z"/></g></g>
    <!-- Unplugged badge (desktop: the daemon is not connected; Bluetooth is ESP32-only).
         Pixel art in art px (v2 steel palette, 1px outline, light top-left, shade bottom-right):
         a wall socket on the right and a plug on a cable that keeps reaching for it. -->
    <g id="socket">
      <path fill="#2F353C" d="M5 -8h10v1h-10zM4 -7h1v14h-1zM15 -7h1v14h-1zM5 7h10v1h-10z"/>
      <path fill="#DCE2E8" d="M5 -7h10v14h-10z"/>
      <path fill="#FFFFFF" d="M5 -7h10v1h-10zM5 -6h1v12h-1z"/>
      <path fill="#A9B2BC" d="M5 6h10v1h-10zM14 -6h1v12h-1z"/>
      <path fill="#2F353C" d="M7 -4h1v4h-1zM12 -4h1v4h-1zM9 2h2v2h-2z"/>
    </g>
    <g id="plug">
      <!-- cable: stepped pixel cord trailing down-left -->
      <path fill="#2F353C" d="M-11 0h3v2h-3zM-13 2h2v2h-2zM-15 4h2v2h-2zM-19 6h4v2h-4z"/>
      <path fill="#4A5059" d="M-11 0h3v1h-3zM-13 2h2v1h-2zM-15 4h2v1h-2zM-19 6h4v1h-4z"/>
      <!-- plug head -->
      <path fill="#2F353C" d="M-7 -4h5v1h-5zM-8 -3h1v7h-1zM-2 -3h1v7h-1zM-7 4h5v1h-5z"/>
      <path fill="#6B737D" d="M-7 -3h5v7h-5z"/>
      <path fill="#A9B2BC" d="M-7 -3h5v1h-5zM-7 -2h1v5h-1z"/>
      <!-- prongs -->
      <path fill="#DCE2E8" d="M-1 -2h4v1h-4zM-1 1h4v1h-4z"/>
      <path fill="#6B737D" d="M-1 -1h4v1h-4zM-1 2h4v1h-4z"/>
    </g>
  </defs>

  <g transform="scale(.5)">
    <!-- crab on the left half -->
    <g transform="translate(-12 0)">
      <g class="hop">
        <path fill="#000000" fill-opacity="0.3" d="M3 30h24v1h-24z"/>
        <path fill="#000000" fill-opacity="0.15" d="M6 31h18v1h-18z"/>
        <use href="#leg1"/><use href="#leg2"/><use href="#leg3"/><use href="#leg4"/>
        <g class="tilt">
          <use href="#torso"/>
          <use href="#arm-l"/>
          <use href="#arm-r"/>
          <use href="#eyes-ur"/>
        </g>
        <g class="q" transform="translate(1 3)"><use href="#qmark"/></g>
        <g class="bang" transform="translate(14 3)"><use href="#bang"/></g>
      </g>
    </g>
    <!-- unplugged socket floating on the right; the plug keeps reaching but never connects -->
    <g transform="translate(38 14)">
      <path class="bshadow" fill="#000000" d="M-8 15h22v1h-22z"/>
      <g class="badge">
        <use href="#socket"/>
        <g class="reach"><use href="#plug"/></g>
        <g class="zap" fill="#FFD84D"><path d="M3 -9h1v2h-1zM2 -7h2v1h-2zM3 -6h1v2h-1z"/></g>
      </g>
    </g>
  </g>
</svg>
