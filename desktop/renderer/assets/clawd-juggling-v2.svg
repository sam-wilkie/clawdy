<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <!-- Clawd v2 (web) juggling — 2+ subagents. 1.5 s loop.
       Motion reference: v1 clawd-working-juggling. Three balls (red, yellow, green) loop in an
       arc over the head, pincer to pincer; the pincers pop up alternately as they throw, the
       eyes look up, the body sways a little. v2 look. Website only. -->
  <defs>
    <style>
      .sway  { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 1.5s ease-in-out infinite; }
      .arm-l { animation: toss-l 1.5s ease-in-out infinite; }
      .arm-r { animation: toss-r 1.5s ease-in-out infinite; }
      .ball  { animation: loop 1.5s linear infinite; }
      .b2 { animation-delay: -0.5s; } .b3 { animation-delay: -1s; }

      @keyframes sway {
        0%, 100% { transform: rotate(-2deg); }
        50%      { transform: rotate(2deg); }
      }
      @keyframes toss-l {
        0%, 30%, 100% { transform: translateY(0); }
        12%           { transform: translateY(-3px); }
      }
      @keyframes toss-r {
        0%, 45%, 80%, 100% { transform: translateY(0); }
        62%                { transform: translateY(-3px); }
      }
      /* oval loop, clockwise: left pincer -> over the head -> right pincer -> back under */
      @keyframes loop {
        0%    { transform: translate(-1px, 15px); }
        12.5% { transform: translate(2px, 3px); }
        25%   { transform: translate(9px, -5px); }
        37.5% { transform: translate(17px, -7px); }
        50%   { transform: translate(25px, -3px); }
        62.5% { transform: translate(30px, 7px); }
        75%   { transform: translate(28px, 15px); }
        87.5% { transform: translate(14px, 11px); }
        100%  { transform: translate(-1px, 15px); }
      }
    </style>

    <!-- ===== v2 rig ===== -->
    <g id="leg1"><path fill="#B8644B" d="M6 18h1v11h-1z"/><path fill="#6B3122" d="M7 18h1v11h-1zM6 29h2v1h-2z"/></g>
    <g id="leg2"><path fill="#B8644B" d="M10 18h1v11h-1z"/><path fill="#6B3122" d="M11 18h1v11h-1zM10 29h2v1h-2z"/></g>
    <g id="leg3"><path fill="#B8644B" d="M18 18h1v11h-1z"/><path fill="#6B3122" d="M19 18h1v11h-1zM18 29h2v1h-2z"/></g>
    <g id="leg4"><path fill="#B8644B" d="M22 18h1v11h-1z"/><path fill="#6B3122" d="M23 18h1v11h-1zM22 29h2v1h-2z"/></g>
    <g id="torso">
      <path fill="#DE886D" d="M24 13h1v1h-1zM8 14h16v1h-16zM6 15h18v8h-18zM5 23h1v2h-1z"/>
      <path fill="#B8644B" d="M24 14h1v9h-1zM6 23h19v2h-19z"/>
      <path fill="#6B3122" d="M4 12h22v1h-22zM4 13h1v12h-1zM25 13h1v12h-1zM4 25h22v1h-22z"/>
      <path fill="#F3AC90" d="M5 13h19v1h-19zM5 14h1v9h-1z"/>
      <path fill="#FFD3C2" d="M6 14h2v1h-2z"/>
    </g>
    <g id="arm-l">
      <path fill="#6B3122" d="M0 15h5v1h-5zM-1 16h1v1h-1zM-1 17h2v1h-2zM1 18h1v2h-1zM-1 20h2v1h-2zM-1 21h1v1h-1zM0 22h5v1h-5z"/>
      <path fill="#F3AC90" d="M1 16h4v1h-4zM1 20h1v1h-1z"/>
      <path fill="#B8644B" d="M0 16h1v1h-1zM1 17h1v1h-1zM0 21h5v1h-5z"/>
      <path fill="#DE886D" d="M2 17h3v4h-3z"/>
    </g>
    <g id="arm-r">
      <path fill="#B8644B" d="M29 16h1v1h-1zM28 17h1v1h-1zM25 21h5v1h-5z"/>
      <path fill="#6B3122" d="M25 15h5v1h-5zM30 16h1v1h-1zM29 17h2v1h-2zM28 18h1v2h-1zM29 20h2v1h-2zM30 21h1v1h-1zM25 22h5v1h-5z"/>
      <path fill="#F3AC90" d="M25 16h4v1h-4zM28 20h1v1h-1z"/>
      <path fill="#DE886D" d="M25 17h3v4h-3z"/>
    </g>
    <!-- eyes looking up: 2x4 with the pupil on top -->
    <g id="eyes-up">
      <path fill="#1B1311" d="M8 15h2v3h-2zM20 15h2v3h-2z"/>
      <path fill="#FFFFFF" d="M8 15h1v1h-1zM20 15h1v1h-1z"/>
    </g>
    <!-- 4x4 ball with a highlight and a shaded corner -->
    <g id="ball-r"><path fill="#E5484D" d="M1 0h2v4h-2zM0 1h4v2h-4z"/><path fill="#FF9EA1" d="M1 1h1v1h-1z"/><path fill="#A42B30" d="M2 3h1v1h-1zM3 2h1v1h-1z"/></g>
    <g id="ball-y"><path fill="#F2B630" d="M1 0h2v4h-2zM0 1h4v2h-4z"/><path fill="#FFE59A" d="M1 1h1v1h-1z"/><path fill="#C98918" d="M2 3h1v1h-1zM3 2h1v1h-1z"/></g>
    <g id="ball-g"><path fill="#45B36B" d="M1 0h2v4h-2zM0 1h4v2h-4z"/><path fill="#A6E5BB" d="M1 1h1v1h-1z"/><path fill="#2B7A46" d="M2 3h1v1h-1zM3 2h1v1h-1z"/></g>
  </defs>

  <g transform="scale(.5)">
    <path fill="#000000" fill-opacity="0.3" d="M3 30h24v1h-24z"/>
    <path fill="#000000" fill-opacity="0.15" d="M6 31h18v1h-18z"/>
    <use href="#leg1"/><use href="#leg2"/><use href="#leg3"/><use href="#leg4"/>
    <!-- balls behind the body: visible over the head and at the sides, hidden as they pass behind -->
    <g class="ball"><use href="#ball-r"/></g>
    <g class="ball b2"><use href="#ball-y"/></g>
    <g class="ball b3"><use href="#ball-g"/></g>
    <g class="sway">
      <use href="#torso"/>
      <use href="#eyes-up"/>
      <g class="arm-l"><use href="#arm-l"/></g>
      <g class="arm-r"><use href="#arm-r"/></g>
    </g>
  </g>
</svg>
