<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <!-- Clawd v2 waiting_reply (new): 2 s loop at 8 fps (16 frames). Turn finished, waiting for the next prompt: wide eyes toward the viewer, blush and smile, left pincer waves, right back foot taps, bubble hops with a blinking bang. -->
  <defs>
    <style>
      .ar-l { animation: ar-l 2s infinite step-end; }
      .ar-l-k0 { animation: ar-l-k0 2s infinite step-end; }
      .ar-l-k1 { animation: ar-l-k1 2s infinite step-end; }
      .ar-l-k2 { animation: ar-l-k2 2s infinite step-end; }
      .ey-wide { animation: ey-wide 2s infinite step-end; }
      .ey-shut { animation: ey-shut 2s infinite step-end; }
      .bang { animation: bang 2s infinite step-end; }
      .bub { animation: bub 2s infinite step-end; }
      .leg4 { animation: leg4 2s infinite step-end; }
      @keyframes ar-l {
        0% { transform: translate(-5px, -6px); }
        9.375% { transform: translate(-3px, -7px); }
        21.875% { transform: translate(-1px, -6px); }
        34.375% { transform: translate(-3px, -7px); }
        46.875% { transform: translate(-5px, -6px); }
        59.375% { transform: translate(-3px, -7px); }
        71.875% { transform: translate(-1px, -6px); }
        84.375% { transform: translate(-3px, -7px); }
      }
      @keyframes ar-l-k0 {
        0% { opacity: 1; }
        9.375% { opacity: 0; }
        46.875% { opacity: 1; }
        59.375% { opacity: 0; }
      }
      @keyframes ar-l-k1 {
        0% { opacity: 0; }
        9.375% { opacity: 1; }
        21.875% { opacity: 0; }
        34.375% { opacity: 1; }
        46.875% { opacity: 0; }
        59.375% { opacity: 1; }
        71.875% { opacity: 0; }
        84.375% { opacity: 1; }
      }
      @keyframes ar-l-k2 {
        0% { opacity: 0; }
        21.875% { opacity: 1; }
        34.375% { opacity: 0; }
        71.875% { opacity: 1; }
        84.375% { opacity: 0; }
      }
      @keyframes ey-wide {
        0% { opacity: 1; }
        71.875% { opacity: 0; }
        84.375% { opacity: 1; }
      }
      @keyframes ey-shut {
        0% { opacity: 0; }
        71.875% { opacity: 1; }
        84.375% { opacity: 0; }
      }
      @keyframes bang {
        0% { opacity: 1; }
        34.375% { opacity: 0; }
        46.875% { opacity: 1; }
        84.375% { opacity: 0; }
      }
      @keyframes bub {
        0% { transform: translate(0px, 0px); }
        21.875% { transform: translate(0px, 1px); }
        46.875% { transform: translate(0px, 0px); }
        71.875% { transform: translate(0px, 1px); }
      }
      @keyframes leg4 {
        0% { transform: translate(0px, -2px); }
        9.375% { transform: translate(0px, 0px); }
        21.875% { transform: translate(0px, -2px); }
        34.375% { transform: translate(0px, 0px); }
        46.875% { transform: translate(0px, -2px); }
        59.375% { transform: translate(0px, 0px); }
        71.875% { transform: translate(0px, -2px); }
        84.375% { transform: translate(0px, 0px); }
      }
    </style>
    <!-- ===== rig: shared Clawd v2 parts, identical in every clawd-*-v2.svg (see clawd-static-base-v2.svg) ===== -->
    <!-- ground shadow, two translucent rows -->
    <g id="shadow">
      <path fill="#000000" fill-opacity="0.3" d="M3 30h24v1h-24z"/>
      <path fill="#000000" fill-opacity="0.15" d="M6 31h18v1h-18z"/>
    </g>
    <!-- leg 1 of 4 (drawn tall; the top is hidden behind the body) -->
    <g id="leg1">
      <path fill="#B8644B" d="M6 18h1v11h-1z"/>
      <path fill="#6B3122" d="M7 18h1v11h-1zM6 29h2v1h-2z"/>
    </g>
    <!-- leg 2 of 4 (drawn tall; the top is hidden behind the body) -->
    <g id="leg2">
      <path fill="#B8644B" d="M10 18h1v11h-1z"/>
      <path fill="#6B3122" d="M11 18h1v11h-1zM10 29h2v1h-2z"/>
    </g>
    <!-- leg 3 of 4 (drawn tall; the top is hidden behind the body) -->
    <g id="leg3">
      <path fill="#B8644B" d="M18 18h1v11h-1z"/>
      <path fill="#6B3122" d="M19 18h1v11h-1zM18 29h2v1h-2z"/>
    </g>
    <!-- leg 4 of 4 (drawn tall; the top is hidden behind the body) -->
    <g id="leg4">
      <path fill="#B8644B" d="M22 18h1v11h-1z"/>
      <path fill="#6B3122" d="M23 18h1v11h-1zM22 29h2v1h-2z"/>
    </g>
    <!-- body: 1 px outline, light top/left, shade bottom/right, specular dot -->
    <g id="torso">
      <path fill="#DE886D" d="M24 13h1v1h-1zM8 14h16v1h-16zM6 15h18v8h-18zM5 23h1v2h-1z"/>
      <path fill="#B8644B" d="M24 14h1v9h-1zM6 23h19v2h-19z"/>
      <path fill="#6B3122" d="M4 12h22v1h-22zM4 13h1v12h-1zM25 13h1v12h-1zM4 25h22v1h-22z"/>
      <path fill="#F3AC90" d="M5 13h19v1h-19zM5 14h1v9h-1z"/>
      <path fill="#FFD3C2" d="M6 14h2v1h-2z"/>
    </g>
    <!-- right pincer fused with the body (rest spot and sliding along the body side) -->
    <g id="arm-r">
      <path fill="#B8644B" d="M29 16h1v1h-1zM28 17h1v1h-1zM25 21h5v1h-5z"/>
      <path fill="#6B3122" d="M25 15h5v1h-5zM30 16h1v1h-1zM29 17h2v1h-2zM28 18h1v2h-1zM29 20h2v1h-2zM30 21h1v1h-1zM25 22h5v1h-5z"/>
      <path fill="#F3AC90" d="M25 16h4v1h-4zM28 20h1v1h-1z"/>
      <path fill="#DE886D" d="M25 17h3v4h-3z"/>
    </g>
    <!-- left pincer, closed outline (any position) -->
    <g id="arm-l-free">
      <path fill="#6B3122" d="M0 15h5v1h-5zM-1 16h1v1h-1zM4 16h1v6h-1zM-1 17h2v1h-2zM1 18h1v2h-1zM-1 20h2v1h-2zM-1 21h1v1h-1zM0 22h5v1h-5z"/>
      <path fill="#F3AC90" d="M1 16h3v1h-3zM1 20h1v1h-1z"/>
      <path fill="#DE886D" d="M2 17h2v4h-2z"/>
      <path fill="#B8644B" d="M0 16h1v1h-1zM1 17h1v1h-1zM0 21h4v1h-4z"/>
    </g>
    <!-- eyes 2x5, wide open -->
    <g id="eyes-wide">
      <path fill="#FFFFFF" d="M8 15h1v1h-1zM20 15h1v1h-1z"/>
      <path fill="#1B1311" d="M9 15h1v1h-1zM21 15h1v1h-1zM8 16h2v4h-2zM20 16h2v4h-2z"/>
    </g>
    <!-- eyes shut, 2x1 line -->
    <g id="eyes-shut">
      <path fill="#1B1311" d="M8 19h2v1h-2zM20 19h2v1h-2z"/>
    </g>
    <!-- blush patches -->
    <g id="blush">
      <path fill="#EA7C7E" d="M7 20h2v1h-2zM21 20h2v1h-2zM6 21h1v1h-1zM9 21h1v1h-1zM20 21h1v1h-1zM23 21h1v1h-1zM7 22h2v1h-2zM21 22h2v1h-2z"/>
      <path fill="#F7A3A1" d="M7 21h2v1h-2zM21 21h2v1h-2z"/>
    </g>
    <!-- small smile -->
    <g id="smile">
      <path fill="#6B3122" d="M13 21h1v1h-1zM16 21h1v1h-1zM14 22h2v1h-2z"/>
    </g>
    <!-- ===== props used by this animation ===== -->
    <g id="wbubble">
      <path fill="#FFFFFF" d="M18 1h10v8h-10zM21 9h1v1h-1z"/>
      <path fill="#2A1E1A" d="M18 0h10v1h-10zM17 1h1v8h-1zM28 1h1v8h-1zM18 9h3v1h-3zM22 9h6v1h-6zM21 10h1v1h-1zM20 11h1v1h-1z"/>
    </g>
    <g id="wbang">
      <path fill="#E25A35" d="M22 2h2v4h-2zM22 7h2v1h-2z"/>
    </g>
  </defs>
  <g transform="scale(.5)">
    <use href="#shadow"/>
    <use href="#leg1"/>
    <use href="#leg2"/>
    <use href="#leg3"/>
    <g class="leg4">
    <use href="#leg4"/>
    </g>
    <use href="#torso"/>
    <g class="ar-l">
    <use href="#arm-l-free"/>
    </g>
    <g class="ar-l-k0">
    <g>
      <path fill="#6B3122" d="M-1 13h7v1h-7zM-1 18h7v1h-7z"/>
      <path fill="#F3AC90" d="M-1 14h7v1h-7z"/>
      <path fill="#DE886D" d="M-1 15h7v2h-7z"/>
      <path fill="#B8644B" d="M-1 17h7v1h-7z"/>
    </g>
    </g>
    <g class="ar-l-k1">
    <g>
      <path fill="#6B3122" d="M1 13h5v1h-5zM1 18h5v1h-5z"/>
      <path fill="#F3AC90" d="M1 14h5v1h-5z"/>
      <path fill="#DE886D" d="M1 15h5v2h-5z"/>
      <path fill="#B8644B" d="M1 17h5v1h-5z"/>
    </g>
    </g>
    <g class="ar-l-k2">
    <g>
      <path fill="#6B3122" d="M3 13h3v1h-3zM3 18h3v1h-3z"/>
      <path fill="#F3AC90" d="M3 14h3v1h-3z"/>
      <path fill="#DE886D" d="M3 15h3v2h-3z"/>
      <path fill="#B8644B" d="M3 17h3v1h-3z"/>
    </g>
    </g>
    <use href="#arm-r"/>
    <g class="ey-wide">
    <use href="#eyes-wide"/>
    </g>
    <g class="ey-shut">
    <use href="#eyes-shut"/>
    </g>
    <use href="#blush"/>
    <use href="#smile"/>
    <g class="bub">
    <use href="#wbubble"/>
    <g class="bang">
    <use href="#wbang"/>
    </g>
    </g>
  </g>
</svg>
