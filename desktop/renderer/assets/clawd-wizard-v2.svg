<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <!-- Clawd v2 (web) wizard — WebSearch / WebFetch. 2.4 s loop.
       Motion reference: v1 clawd-working-wizard. Purple wizard hat with a gold star, the right
       pincer waves a wand, colourful sparkles rise from the tip and fade, the crab blinks with
       focus and bobs gently. v2 look. Website only. -->
  <defs>
    <style>
      .bob   { animation: bob 2.4s ease-in-out infinite; }
      .wave  { transform-box: fill-box; transform-origin: 0% 100%; animation: wave 1.2s ease-in-out infinite; }
      .spk   { animation: spk 2.4s ease-out infinite; }
      .k2 { animation-delay: -0.6s; } .k3 { animation-delay: -1.2s; } .k4 { animation-delay: -1.8s; }
      .ey-open { animation: ey-open 2.4s steps(1) infinite; }
      .ey-shut { animation: ey-shut 2.4s steps(1) infinite; }

      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1px); } }
      @keyframes wave {
        0%, 100% { transform: rotate(-18deg); }
        50%      { transform: rotate(14deg); }
      }
      @keyframes spk {
        0%   { transform: translate(0, 0) scale(0.4); opacity: 0; }
        12%  { transform: translate(1px, -2px) scale(1); opacity: 1; }
        100% { transform: translate(4px, -18px) scale(0.6); opacity: 0; }
      }
      @keyframes ey-open { 0% { opacity: 0; } 40% { opacity: 1; } 70% { opacity: 0; } }
      @keyframes ey-shut { 0% { opacity: 1; } 40% { opacity: 0; } 70% { opacity: 1; } }
    </style>

    <!-- ===== v2 rig ===== -->
    <g id="leg1"><path fill="#B8644B" d="M6 18h1v11h-1z"/><path fill="#6B3122" d="M7 18h1v11h-1zM6 29h2v1h-2z"/></g>
    <g id="leg2"><path fill="#B8644B" d="M10 18h1v11h-1z"/><path fill="#6B3122" d="M11 18h1v11h-1zM10 29h2v1h-2z"/></g>
    <g id="leg3"><path fill="#B8644B" d="M18 18h1v11h-1z"/><path fill="#6B3122" d="M19 18h1v11h-1zM18 29h2v1h-2z"/></g>
    <g id="leg4"><path fill="#B8644B" d="M22 18h1v11h-1z"/><path fill="#6B3122" d="M23 18h1v11h-1zM22 29h2v1h-2z"/></g>
    <g id="torso">
      <path fill="#DE886D" d="M24 13h1v1h-1zM8 14h16v1h-16zM6 15h18v8h-18zM5 23h1v2h-1z"/>
      <path fill="#B8644B" d="M24 14h1v9h-1zM6 23h19v2h-19z"/>
      <path fill="#6B3122" d="M4 12h22v1h-22zM4 13h1v12h-1zM25 13h1v12h-1zM4 25h22v1h-22z"/>
      <path fill="#F3AC90" d="M5 13h19v1h-19zM5 14h1v9h-1z"/>
      <path fill="#FFD3C2" d="M6 14h2v1h-2z"/>
    </g>
    <g id="arm-l">
      <path fill="#6B3122" d="M0 15h5v1h-5zM-1 16h1v1h-1zM-1 17h2v1h-2zM1 18h1v2h-1zM-1 20h2v1h-2zM-1 21h1v1h-1zM0 22h5v1h-5z"/>
      <path fill="#F3AC90" d="M1 16h4v1h-4zM1 20h1v1h-1z"/>
      <path fill="#B8644B" d="M0 16h1v1h-1zM1 17h1v1h-1zM0 21h5v1h-5z"/>
      <path fill="#DE886D" d="M2 17h3v4h-3z"/>
    </g>
    <g id="arm-r">
      <path fill="#B8644B" d="M29 16h1v1h-1zM28 17h1v1h-1zM25 21h5v1h-5z"/>
      <path fill="#6B3122" d="M25 15h5v1h-5zM30 16h1v1h-1zM29 17h2v1h-2zM28 18h1v2h-1zM29 20h2v1h-2zM30 21h1v1h-1zM25 22h5v1h-5z"/>
      <path fill="#F3AC90" d="M25 16h4v1h-4zM28 20h1v1h-1z"/>
      <path fill="#DE886D" d="M25 17h3v4h-3z"/>
    </g>
    <g id="eyes-open">
      <path fill="#FFFFFF" d="M8 16h1v1h-1zM20 16h1v1h-1z"/>
      <path fill="#1B1311" d="M9 16h1v1h-1zM21 16h1v1h-1zM8 17h2v3h-2zM20 17h2v3h-2z"/>
    </g>
    <g id="eyes-shut"><path fill="#1B1311" d="M8 19h2v1h-2zM20 19h2v1h-2z"/></g>

    <!-- ===== wizard hat: stepped cone (outline + purple + light left edge), brim, gold star ===== -->
    <g id="hat">
      <path fill="#5865C8" d="M11 -2h2v1h-2zM12 -1h1v1h-1zM11 0h4v1h-4zM11 1h6v3h-6zM18 3h1v1h-1zM10 4h10v1h-10zM9 5h5v1h-5zM15 5h6v1h-6zM8 6h1v1h-1zM10 6h10v1h-10zM21 6h1v1h-1zM7 7h16v1h-16zM6 8h18v1h-18z"/>
      <path fill="#2C2557" d="M4 9h22v1h-22zM4 11h22v2h-22z"/>
      <path fill="#232A66" d="M10 -3h4v1h-4zM9 -2h1v1h-1zM14 -2h1v1h-1zM10 -1h1v1h-1zM15 -1h1v1h-1zM9 0h1v4h-1zM16 0h1v1h-1zM17 1h2v1h-2zM18 2h1v1h-1zM19 3h2v1h-2zM8 4h1v1h-1zM21 4h1v1h-1zM7 5h1v1h-1zM22 5h1v1h-1zM6 6h1v1h-1zM23 6h1v1h-1zM5 7h1v1h-1zM24 7h1v1h-1zM4 8h1v1h-1zM25 8h1v1h-1zM3 9h1v4h-1zM26 9h1v4h-1zM1 13h2v1h-2zM27 13h2v1h-2zM0 14h1v1h-1zM29 14h1v1h-1zM1 15h28v1h-28z"/>
      <path fill="#8E94F0" d="M3 13h12v1h-12zM1 14h14v1h-14z"/>
      <path fill="#6A70D8" d="M15 13h12v1h-12zM15 14h14v1h-14z"/>
      <path fill="#473F96" d="M4 10h22v1h-22z"/>
      <path fill="#7F8BE8" d="M10 -2h1v1h-1zM11 -1h1v1h-1zM10 0h1v2h-1zM10 3h1v1h-1zM9 4h1v1h-1zM8 5h1v1h-1zM7 6h1v1h-1zM6 7h1v1h-1zM5 8h1v1h-1z"/>
      <path fill="#404CB0" d="M13 -2h1v1h-1zM14 -1h1v1h-1zM15 0h1v1h-1zM17 2h1v1h-1zM20 4h1v1h-1zM21 5h1v1h-1zM22 6h1v1h-1zM23 7h1v1h-1zM24 8h1v1h-1z"/>
      <path fill="#FFFFFF" d="M13 -1h1v1h-1zM10 2h1v1h-1zM17 3h1v1h-1zM14 5h1v1h-1zM9 6h1v1h-1zM20 6h1v1h-1z"/>
    </g>
    <!-- wand: dark stick from the pincer up and out, gold tip -->
    <g id="wand">
      <path fill="#5C3922" d="M30 18h1v1h-1zM31 17h1v1h-1zM32 16h1v1h-1zM33 15h1v1h-1zM34 14h1v1h-1z"/>
      <path fill="#93603E" d="M30 17h1v1h-1zM31 16h1v1h-1zM32 15h1v1h-1zM33 14h1v1h-1z"/>
      <path fill="#FFD84D" d="M34 12h1v3h-1zM33 13h3v1h-3z"/>
      <path fill="#FFFFFF" d="M34 13h1v1h-1z"/>
    </g>
    <g id="spark">
      <path d="M1 0h1v3h-1zM0 1h3v1h-3z"/>
    </g>
  </defs>

  <g transform="scale(.5)">
    <path fill="#000000" fill-opacity="0.3" d="M3 30h24v1h-24z"/>
    <path fill="#000000" fill-opacity="0.15" d="M6 31h18v1h-18z"/>
    <use href="#leg1"/><use href="#leg2"/><use href="#leg3"/><use href="#leg4"/>
    <g class="bob">
      <use href="#torso"/>
      <use href="#arm-l"/>
      <g class="ey-open"><use href="#eyes-open"/></g>
      <g class="ey-shut"><use href="#eyes-shut"/></g>
      <use href="#hat"/>
      <g class="wave"><use href="#arm-r"/><use href="#wand"/></g>
    </g>
    <!-- sparkles spawn near the wand tip and drift up -->
    <g transform="translate(33 9)">
      <g class="spk" fill="#FFD84D"><use href="#spark"/></g>
      <g class="spk k2" fill="#7FD3F0"><use href="#spark"/></g>
      <g class="spk k3" fill="#C9A0F0"><use href="#spark"/></g>
      <g class="spk k4" fill="#F59A8C"><use href="#spark"/></g>
    </g>
  </g>
</svg>
