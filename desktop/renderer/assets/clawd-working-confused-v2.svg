    <!-- ===== rig: shared Clawd v2 parts, identical in every clawd-*-v2.svg (see clawd-static-base-v2.svg) ===== -->
    <!-- body: 1 px outline, light top/left, shade bottom/right, specular dot -->
    <g id="torso">
      <path fill="#DE886D" d="M24 13h1v1h-1zM8 14h16v1h-16zM6 15h18v8h-18zM5 23h1v2h-1z"/>
      <path fill="#B8644B" d="M24 14h1v9h-1zM6 23h19v2h-19z"/>
      <path fill="#6B3122" d="M4 12h22v1h-22zM4 13h1v12h-1zM25 13h1v12h-1zM4 25h22v1h-22z"/>
      <path fill="#F3AC90" d="M5 13h19v1h-19zM5 14h1v9h-1z"/>
      <path fill="#FFD3C2" d="M6 14h2v1h-2z"/>
    </g>
    <!-- right pincer fused with the body (rest spot and sliding along the body side) -->
    <g id="arm-r">
      <path fill="#B8644B" d="M29 16h1v1h-1zM28 17h1v1h-1zM25 21h5v1h-5z"/>
      <path fill="#6B3122" d="M25 15h5v1h-5zM30 16h1v1h-1zM29 17h2v1h-2zM28 18h1v2h-1zM29 20h2v1h-2zM30 21h1v1h-1zM25 22h5v1h-5z"/>
      <path fill="#F3AC90" d="M25 16h4v1h-4zM28 20h1v1h-1z"/>
      <path fill="#DE886D" d="M25 17h3v4h-3z"/>
    </g>
    <!-- left pincer, closed outline (any position) -->
    <g id="arm-l-free">
      <path fill="#6B3122" d="M0 15h5v1h-5zM-1 16h1v1h-1zM4 16h1v6h-1zM-1 17h2v1h-2zM1 18h1v2h-1zM-1 20h2v1h-2zM-1 21h1v1h-1zM0 22h5v1h-5z"/>
      <path fill="#F3AC90" d="M1 16h3v1h-3zM1 20h1v1h-1z"/>
      <path fill="#DE886D" d="M2 17h2v4h-2z"/>
      <path fill="#B8644B" d="M0 16h1v1h-1zM1 17h1v1h-1zM0 21h4v1h-4z"/>
    </g>
    <!-- eyes 2x4 with a white highlight -->
    <g id="eyes-open">
      <path fill="#FFFFFF" d="M8 16h1v1h-1zM20 16h1v1h-1z"/>
      <path fill="#1B1311" d="M9 16h1v1h-1zM21 16h1v1h-1zM8 17h2v3h-2zM20 17h2v3h-2z"/>
    </g>
    <!-- eyes shut, 2x1 line -->
    <g id="eyes-shut">
      <path fill="#1B1311" d="M8 19h2v1h-2zM20 19h2v1h-2z"/>
    </g>
    <!-- leg 1, 7 px long -->
    <g id="leg1-n7">
      <path fill="#B8644B" d="M6 23h1v6h-1z"/>
      <path fill="#6B3122" d="M7 23h1v6h-1zM6 29h2v1h-2z"/>
    </g>
    <!-- leg 2, 7 px long -->
    <g id="leg2-n7">
      <path fill="#B8644B" d="M10 23h1v6h-1z"/>
      <path fill="#6B3122" d="M11 23h1v6h-1zM10 29h2v1h-2z"/>
    </g>
    <!-- leg 3, 7 px long -->
    <g id="leg3-n7">
      <path fill="#B8644B" d="M18 23h1v6h-1z"/>
      <path fill="#6B3122" d="M19 23h1v6h-1zM18 29h2v1h-2z"/>
    </g>
    <!-- leg 4, 7 px long -->
    <g id="leg4-n7">
      <path fill="#B8644B" d="M22 23h1v6h-1z"/>
      <path fill="#6B3122" d="M23 23h1v6h-1zM22 29h2v1h-2z"/>
    </g>
    <!-- leaning body 22x14 -->
    <g id="torso-22x14-lp1p0p0">
      <path fill="#DE886D" d="M8 14h17v1h-17zM6 15h18v8h-18z"/>
      <path fill="#B8644B" d="M25 13h1v2h-1zM24 15h1v8h-1zM5 23h20v2h-20z"/>
      <path fill="#6B3122" d="M5 12h22v1h-22zM5 13h1v2h-1zM26 13h1v2h-1zM4 15h1v10h-1zM25 15h1v10h-1zM4 25h22v1h-22z"/>
      <path fill="#F3AC90" d="M6 13h19v1h-19zM5 15h1v8h-1z"/>
      <path fill="#FFD3C2" d="M6 14h2v1h-2z"/>
    </g>
    <!-- leaning body 22x14 -->
    <g id="torso-22x14-lm1p0p0">
      <path fill="#DE886D" d="M6 14h17v1h-17zM6 15h18v8h-18z"/>
      <path fill="#B8644B" d="M4 13h1v1h-1zM23 13h1v2h-1zM24 15h1v8h-1zM5 23h20v2h-20z"/>
      <path fill="#6B3122" d="M3 12h22v1h-22zM3 13h1v2h-1zM24 13h1v2h-1zM4 15h1v10h-1zM25 15h1v10h-1zM4 25h22v1h-22z"/>
      <path fill="#F3AC90" d="M5 13h18v1h-18zM5 15h1v8h-1z"/>
      <path fill="#FFD3C2" d="M4 14h2v1h-2z"/>
    </g>
    <!-- ground shadow 24 wide -->
