<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <!-- Clawd v2 confused: 6 s loop at 8 fps (48 frames). Same beats as clawd-working-confused.svg: left pincer scratching the head, the body and eyes look left then right, three blinks, a cyan ? pops on the left and an amber ? on the right. -->
  <defs>
    <style>
      .stv0 { animation: stv0 6s infinite step-end; }
      .stv1 { animation: stv1 6s infinite step-end; }
      .stv2 { animation: stv2 6s infinite step-end; }
      .stm { animation: stm 6s infinite step-end; }
      .sshm { animation: sshm 6s infinite step-end; }
      .slg1m7 { animation: slg1m7 6s infinite step-end; }
      .slg2m7 { animation: slg2m7 6s infinite step-end; }
      .slg3m7 { animation: slg3m7 6s infinite step-end; }
      .slg4m7 { animation: slg4m7 6s infinite step-end; }
      .sey-eyes-open { animation: sey-eyes-open 6s infinite step-end; }
      .sey-eyes-shut { animation: sey-eyes-shut 6s infinite step-end; }
      .sey-mv { animation: sey-mv 6s infinite step-end; }
      .sal { animation: sal 6s infinite step-end; }
      .sar { animation: sar 6s infinite step-end; }
      .qmLn { animation: qmLn 6s infinite step-end; }
      .qvLn { animation: qvLn 6s infinite step-end; }
      .qmLs { animation: qmLs 6s infinite step-end; }
      .qvLs { animation: qvLs 6s infinite step-end; }
      .qmRn { animation: qmRn 6s infinite step-end; }
      .qvRn { animation: qvRn 6s infinite step-end; }
      .qmRs { animation: qmRs 6s infinite step-end; }
      .qvRs { animation: qvRs 6s infinite step-end; }
      @keyframes stv0 {
        0% { opacity: 1; }
        11.4583% { opacity: 0; }
        38.5417% { opacity: 1; }
        46.875% { opacity: 0; }
        71.875% { opacity: 1; }
      }
      @keyframes stv1 {
        0% { opacity: 0; }
        11.4583% { opacity: 1; }
        38.5417% { opacity: 0; }
      }
      @keyframes stv2 {
        0% { opacity: 0; }
        46.875% { opacity: 1; }
        71.875% { opacity: 0; }
      }
      @keyframes stm {
        0% { transform: translate(0px, 0px); }
        11.4583% { transform: translate(-2px, 0px); }
        13.5417% { transform: translate(-4px, 0px); }
        36.4583% { transform: translate(-2px, 0px); }
        38.5417% { transform: translate(0px, 0px); }
        46.875% { transform: translate(3px, 0px); }
        48.9583% { transform: translate(4px, 0px); }
        71.875% { transform: translate(1px, 0px); }
        73.9583% { transform: translate(0px, 0px); }
      }
      @keyframes sshm {
        0% { transform: translate(0px, 0px); }
        11.4583% { transform: translate(-2px, 0px); }
        13.5417% { transform: translate(-4px, 0px); }
        36.4583% { transform: translate(-2px, 0px); }
        38.5417% { transform: translate(0px, 0px); }
        46.875% { transform: translate(3px, 0px); }
        48.9583% { transform: translate(4px, 0px); }
        71.875% { transform: translate(1px, 0px); }
        73.9583% { transform: translate(0px, 0px); }
      }
      @keyframes slg1m7 {
        0% { transform: translate(0px, 0px); }
        11.4583% { transform: translate(-1px, 0px); }
        13.5417% { transform: translate(-2px, 0px); }
        36.4583% { transform: translate(-1px, 0px); }
        38.5417% { transform: translate(0px, 0px); }
        46.875% { transform: translate(1px, 0px); }
        48.9583% { transform: translate(2px, 0px); }
        71.875% { transform: translate(0px, 0px); }
      }
      @keyframes slg2m7 {
        0% { transform: translate(0px, 0px); }
        11.4583% { transform: translate(-1px, 0px); }
        13.5417% { transform: translate(-2px, 0px); }
        36.4583% { transform: translate(-1px, 0px); }
        38.5417% { transform: translate(0px, 0px); }
        46.875% { transform: translate(1px, 0px); }
        48.9583% { transform: translate(2px, 0px); }
        71.875% { transform: translate(0px, 0px); }
      }
      @keyframes slg3m7 {
        0% { transform: translate(0px, 0px); }
        11.4583% { transform: translate(-1px, 0px); }
        13.5417% { transform: translate(-2px, 0px); }
        36.4583% { transform: translate(-1px, 0px); }
        38.5417% { transform: translate(0px, 0px); }
        46.875% { transform: translate(1px, 0px); }
        48.9583% { transform: translate(2px, 0px); }
        71.875% { transform: translate(0px, 0px); }
      }
      @keyframes slg4m7 {
        0% { transform: translate(0px, 0px); }
        11.4583% { transform: translate(-1px, 0px); }
        13.5417% { transform: translate(-2px, 0px); }
        36.4583% { transform: translate(-1px, 0px); }
        38.5417% { transform: translate(0px, 0px); }
        46.875% { transform: translate(1px, 0px); }
        48.9583% { transform: translate(2px, 0px); }
        71.875% { transform: translate(0px, 0px); }
      }
      @keyframes sey-eyes-open {
        0% { opacity: 1; }
        13.5417% { opacity: 0; }
        15.625% { opacity: 1; }
        48.9583% { opacity: 0; }
        51.0417% { opacity: 1; }
        80.2083% { opacity: 0; }
        82.2917% { opacity: 1; }
      }
      @keyframes sey-eyes-shut {
        0% { opacity: 0; }
        13.5417% { opacity: 1; }
        15.625% { opacity: 0; }
        48.9583% { opacity: 1; }
        51.0417% { opacity: 0; }
        80.2083% { opacity: 1; }
        82.2917% { opacity: 0; }
      }
      @keyframes sey-mv {
        0% { transform: translate(0px, 0px); }
        11.4583% { transform: translate(-3px, 0px); }
        13.5417% { transform: translate(-6px, 0px); }
        36.4583% { transform: translate(-3px, 0px); }
        38.5417% { transform: translate(0px, 0px); }
        46.875% { transform: translate(4px, 0px); }
        48.9583% { transform: translate(6px, 0px); }
        71.875% { transform: translate(2px, 0px); }
        73.9583% { transform: translate(0px, 0px); }
      }
      @keyframes sal {
        0% { transform: translate(0px, -7px); }
        11.4583% { transform: translate(-2px, -7px); }
        13.5417% { transform: translate(-4px, -7px); }
        36.4583% { transform: translate(-2px, -7px); }
        38.5417% { transform: translate(0px, -7px); }
        46.875% { transform: translate(3px, -7px); }
        48.9583% { transform: translate(4px, -7px); }
        71.875% { transform: translate(1px, -7px); }
        73.9583% { transform: translate(0px, -7px); }
      }
      @keyframes sar {
        0% { transform: translate(0px, 0px); }
        11.4583% { transform: translate(-2px, 0px); }
        13.5417% { transform: translate(-4px, 0px); }
        36.4583% { transform: translate(-2px, 0px); }
        38.5417% { transform: translate(0px, 0px); }
        46.875% { transform: translate(3px, 0px); }
        48.9583% { transform: translate(4px, 0px); }
        71.875% { transform: translate(1px, 0px); }
        73.9583% { transform: translate(0px, 0px); }
      }
      @keyframes qmLn {
        0% { transform: translate(0px, 0px); }
        17.7083% { transform: translate(-8px, 5px); }
        19.7917% { transform: translate(-8px, -1px); }
        30.2083% { transform: translate(-8px, -3px); }
        32.2917% { transform: translate(0px, 0px); }
      }
      @keyframes qvLn {
        0% { opacity: 0; }
        17.7083% { opacity: 1; }
        32.2917% { opacity: 0; }
      }
      @keyframes qmLs {
        0% { transform: translate(0px, 0px); }
        15.625% { transform: translate(-7px, 12px); }
        17.7083% { transform: translate(0px, 0px); }
        32.2917% { transform: translate(-7px, -6px); }
        34.375% { transform: translate(0px, 0px); }
      }
      @keyframes qvLs {
        0% { opacity: 0; }
        15.625% { opacity: 1; }
        17.7083% { opacity: 0; }
        32.2917% { opacity: 1; }
        34.375% { opacity: 0; }
      }
      @keyframes qmRn {
        0% { transform: translate(0px, 0px); }
        53.125% { transform: translate(15px, 5px); }
        55.2083% { transform: translate(15px, -1px); }
        65.625% { transform: translate(15px, -3px); }
        67.7083% { transform: translate(0px, 0px); }
      }
      @keyframes qvRn {
        0% { opacity: 0; }
        53.125% { opacity: 1; }
        67.7083% { opacity: 0; }
      }
      @keyframes qmRs {
        0% { transform: translate(0px, 0px); }
        51.0417% { transform: translate(16px, 12px); }
        53.125% { transform: translate(0px, 0px); }
        67.7083% { transform: translate(16px, -6px); }
        69.7917% { transform: translate(0px, 0px); }
      }
      @keyframes qvRs {
        0% { opacity: 0; }
        51.0417% { opacity: 1; }
        53.125% { opacity: 0; }
        67.7083% { opacity: 1; }
        69.7917% { opacity: 0; }
      }
