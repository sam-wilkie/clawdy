<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <!-- Clawd v2 no credits: 4 s loop at 6 fps (24 frames). A declined credit card slides in over the head and its red X blinks, the crab shrugs with its pincers out, a big cute tear rolls down; body and legs dip together (legs swap 5px/4px variants so the body never detaches) and small gold coins drift away. Used by the desktop pet only (out_of_credits). -->
  <defs>
    <style>
      .cardmv { animation: cardmv 4s infinite step-end; }
      .xk { animation: xk 4s infinite step-end; }
      .tmv { animation: tmv 4s infinite step-end; }
      .arl { animation: arl 4s infinite step-end; }
      .arr { animation: arr 4s infinite step-end; }
      .tear { animation: tear 4s infinite step-end; }
      .eysq { animation: eysq 4s infinite step-end; }
      .eysh { animation: eysh 4s infinite step-end; }
      @keyframes cardmv {
        0.0% { transform: translate(0px, -17px); opacity: 1; }
        4.1667% { transform: translate(0px, -11px); }
        8.3333% { transform: translate(0px, -6px); }
        12.5% { transform: translate(0px, -3px); }
        37.5% { transform: translate(0px, -2px); }
        50.0% { transform: translate(0px, -3px); }
        62.5% { transform: translate(0px, -2px); }
        70.8333% { transform: translate(0px, -3px); }
        75.0% { transform: translate(0px, -5px); }
        79.1667% { transform: translate(0px, -7px); opacity: 0.6; }
        83.3333% { transform: translate(0px, -9px); opacity: 0.3; }
        87.5% { transform: translate(0px, -9px); opacity: 0; }
      }
      @keyframes xk {
        0.0% { opacity: 0; }
        20.8333% { opacity: 1; }
        33.3333% { opacity: 0; }
        37.5% { opacity: 1; }
        50.0% { opacity: 0; }
        54.1667% { opacity: 1; }
        75.0% { opacity: 1; }
      }
      @keyframes tmv {
        0.0% { transform: translate(0px, 0px); }
        16.6667% { transform: translate(0px, 1px); }
        25.0% { transform: translate(0px, 2px); }
        41.6667% { transform: translate(0px, 1px); }
        50.0% { transform: translate(0px, 0px); }
        66.6667% { transform: translate(0px, 1px); }
        87.5% { transform: translate(0px, 0px); }
      }
      @keyframes arl {
        0.0% { transform: translate(0px, 0px); }
        16.6667% { transform: translate(0px, 1px); }
        25.0% { transform: translate(-1px, 1px); }
        41.6667% { transform: translate(-1px, 0px); }
        50.0% { transform: translate(0px, 0px); }
        66.6667% { transform: translate(0px, 1px); }
        87.5% { transform: translate(0px, 0px); }
      }
      @keyframes arr {
        0.0% { transform: translate(0px, 0px); }
        16.6667% { transform: translate(0px, 1px); }
        25.0% { transform: translate(1px, 1px); }
        41.6667% { transform: translate(1px, 0px); }
        50.0% { transform: translate(0px, 0px); }
        66.6667% { transform: translate(0px, 1px); }
        87.5% { transform: translate(0px, 0px); }
      }
      @keyframes tear {
        0.0% { opacity: 0; }
        58.3333% { opacity: 1; transform: translate(0px, 0px); }
        62.5% { opacity: 1; transform: translate(0px, 1px); }
        66.6667% { opacity: 1; transform: translate(0px, 2px); }
        70.8333% { opacity: 1; transform: translate(0px, 3px); }
        75.0% { opacity: 1; transform: translate(0px, 4px); }
        79.1667% { opacity: 0.6; transform: translate(0px, 5px); }
        83.3333% { opacity: 0; }
      }
      @keyframes eysq {
        0.0% { opacity: 1; }
        50.0% { opacity: 0; }
        58.3333% { opacity: 1; }
      }
      @keyframes eysh {
        0.0% { opacity: 0; }
        50.0% { opacity: 1; }
        58.3333% { opacity: 0; }
      }
      .coin1 { animation: coin1 4s infinite step-end; }
      .coin2 { animation: coin2 4s infinite step-end; }
      .coin3 { animation: coin3 4s infinite step-end; }
      .coin4 { animation: coin4 4s infinite step-end; }
      .coin5 { animation: coin5 4s infinite step-end; }
      .coin6 { animation: coin6 4s infinite step-end; }
      .coin7 { animation: coin7 4s infinite step-end; }
      .coin8 { animation: coin8 4s infinite step-end; }
      @keyframes coin1 {
        0.0% { transform: translate(-5px, 16px); opacity: 1; }
        4.1667% { transform: translate(-6px, 14px); opacity: 1; }
        8.3333% { transform: translate(-7px, 12px); opacity: 1; }
        12.5% { transform: translate(-8px, 10px); opacity: 1; }
        16.6667% { transform: translate(-9px, 8px); opacity: 1; }
        20.8333% { transform: translate(-10px, 6px); opacity: 1; }
        25.0% { transform: translate(-11px, 4px); opacity: 0.6; }
        29.1667% { transform: translate(-12px, 2px); opacity: 0.3; }
        33.3333% { opacity: 0; }
      }
      @keyframes coin2 {
        0.0% { opacity: 0; }
        12.5% { transform: translate(30px, 14px); opacity: 1; }
        16.6667% { transform: translate(31px, 12px); opacity: 1; }
        20.8333% { transform: translate(32px, 10px); opacity: 1; }
        25.0% { transform: translate(33px, 8px); opacity: 1; }
        29.1667% { transform: translate(34px, 6px); opacity: 1; }
        33.3333% { transform: translate(35px, 4px); opacity: 1; }
        37.5% { transform: translate(36px, 2px); opacity: 0.6; }
        41.6667% { transform: translate(37px, 0px); opacity: 0.3; }
        45.8333% { opacity: 0; }
      }
      @keyframes coin3 {
        0.0% { opacity: 0; }
        25.0% { transform: translate(-3px, 8px); opacity: 1; }
        29.1667% { transform: translate(-4px, 7px); opacity: 1; }
        33.3333% { transform: translate(-5px, 6px); opacity: 1; }
        37.5% { transform: translate(-6px, 5px); opacity: 1; }
        41.6667% { transform: translate(-7px, 4px); opacity: 1; }
        45.8333% { transform: translate(-8px, 3px); opacity: 1; }
        50.0% { transform: translate(-9px, 2px); opacity: 0.6; }
        54.1667% { transform: translate(-10px, 1px); opacity: 0.3; }
        58.3333% { opacity: 0; }
      }
      @keyframes coin4 {
        0.0% { opacity: 0; }
        37.5% { transform: translate(31px, 6px); opacity: 1; }
        41.6667% { transform: translate(32px, 4px); opacity: 1; }
        45.8333% { transform: translate(33px, 2px); opacity: 1; }
        50.0% { transform: translate(34px, 0px); opacity: 1; }
        54.1667% { transform: translate(35px, -2px); opacity: 1; }
        58.3333% { transform: translate(36px, -4px); opacity: 1; }
        62.5% { transform: translate(37px, -6px); opacity: 0.6; }
        66.6667% { transform: translate(38px, -8px); opacity: 0.3; }
        70.8333% { opacity: 0; }
      }
      @keyframes coin5 {
        0.0% { opacity: 0; }
        50.0% { transform: translate(-6px, 20px); opacity: 1; }
        54.1667% { transform: translate(-8px, 18px); opacity: 1; }
        58.3333% { transform: translate(-10px, 16px); opacity: 1; }
        62.5% { transform: translate(-12px, 14px); opacity: 1; }
        66.6667% { transform: translate(-14px, 12px); opacity: 1; }
        70.8333% { transform: translate(-16px, 10px); opacity: 1; }
        75.0% { transform: translate(-18px, 8px); opacity: 0.6; }
        79.1667% { transform: translate(-20px, 6px); opacity: 0.3; }
        83.3333% { opacity: 0; }
      }
      @keyframes coin6 {
        0.0% { opacity: 0; }
        62.5% { transform: translate(32px, 18px); opacity: 1; }
        66.6667% { transform: translate(33px, 17px); opacity: 1; }
        70.8333% { transform: translate(34px, 16px); opacity: 1; }
        75.0% { transform: translate(35px, 15px); opacity: 1; }
        79.1667% { transform: translate(36px, 14px); opacity: 1; }
        83.3333% { transform: translate(37px, 13px); opacity: 1; }
        87.5% { transform: translate(38px, 12px); opacity: 0.6; }
        91.6667% { transform: translate(39px, 11px); opacity: 0.3; }
        95.8333% { opacity: 0; }
      }
      @keyframes coin7 {
        0.0% { transform: translate(-10px, 0px); opacity: 0.6; }
        4.1667% { transform: translate(-11px, -2px); opacity: 0.3; }
        8.3333% { opacity: 0; }
        75.0% { transform: translate(-4px, 12px); opacity: 1; }
        79.1667% { transform: translate(-5px, 10px); opacity: 1; }
        83.3333% { transform: translate(-6px, 8px); opacity: 1; }
        87.5% { transform: translate(-7px, 6px); opacity: 1; }
        91.6667% { transform: translate(-8px, 4px); opacity: 1; }
        95.8333% { transform: translate(-9px, 2px); opacity: 1; }
      }
      @keyframes coin8 {
        0.0% { transform: translate(36px, 4px); opacity: 1; }
        4.1667% { transform: translate(38px, 2px); opacity: 1; }
        8.3333% { transform: translate(40px, 0px); opacity: 1; }
        12.5% { transform: translate(42px, -2px); opacity: 0.6; }
        16.6667% { transform: translate(44px, -4px); opacity: 0.3; }
        20.8333% { opacity: 0; }
        87.5% { transform: translate(30px, 10px); opacity: 1; }
        91.6667% { transform: translate(32px, 8px); opacity: 1; }
        95.8333% { transform: translate(34px, 6px); opacity: 1; }
      }
      .wa { animation: wa 4s infinite step-end; }
      .wb { animation: wb 4s infinite step-end; }
      @keyframes wa {
        0.0% { opacity: 1; }
        4.1667% { opacity: 0; }
        8.3333% { opacity: 1; }
        12.5% { opacity: 0; }
        16.6667% { opacity: 1; }
        20.8333% { opacity: 0; }
        25.0% { opacity: 1; }
        29.1667% { opacity: 0; }
        33.3333% { opacity: 1; }
        37.5% { opacity: 0; }
        41.6667% { opacity: 1; }
        45.8333% { opacity: 0; }
        50.0% { opacity: 1; }
        54.1667% { opacity: 0; }
        58.3333% { opacity: 1; }
        62.5% { opacity: 0; }
        66.6667% { opacity: 1; }
        70.8333% { opacity: 0; }
        75.0% { opacity: 1; }
        79.1667% { opacity: 0; }
        83.3333% { opacity: 1; }
        87.5% { opacity: 0; }
        91.6667% { opacity: 1; }
        95.8333% { opacity: 0; }
      }
      @keyframes wb {
        0.0% { opacity: 0; }
        4.1667% { opacity: 1; }
        8.3333% { opacity: 0; }
        12.5% { opacity: 1; }
        16.6667% { opacity: 0; }
        20.8333% { opacity: 1; }
        25.0% { opacity: 0; }
        29.1667% { opacity: 1; }
        33.3333% { opacity: 0; }
        37.5% { opacity: 1; }
        41.6667% { opacity: 0; }
        45.8333% { opacity: 1; }
        50.0% { opacity: 0; }
        54.1667% { opacity: 1; }
        58.3333% { opacity: 0; }
        62.5% { opacity: 1; }
        66.6667% { opacity: 0; }
        70.8333% { opacity: 1; }
        75.0% { opacity: 0; }
        79.1667% { opacity: 1; }
        83.3333% { opacity: 0; }
        87.5% { opacity: 1; }
        91.6667% { opacity: 0; }
        95.8333% { opacity: 1; }
      }
      .lgv5 { animation: lgv5 4s infinite step-end; }
      .lgv4 { animation: lgv4 4s infinite step-end; }
      @keyframes lgv5 {
        0.0% { opacity: 1; }
        16.6667% { opacity: 0; }
        50.0% { opacity: 1; }
        66.6667% { opacity: 0; }
        87.5% { opacity: 1; }
      }
      @keyframes lgv4 {
        0.0% { opacity: 0; }
        16.6667% { opacity: 1; }
        50.0% { opacity: 0; }
        66.6667% { opacity: 1; }
        87.5% { opacity: 0; }
      }
    </style>
    <!-- ===== rig: shared Clawd v2 parts, identical in every clawd-*-v2.svg (see clawd-static-base-v2.svg) ===== -->
    <!-- ground shadow, two translucent rows -->
    <g id="shadow">
      <path fill="#000000" fill-opacity="0.3" d="M3 30h24v1h-24z"/>
      <path fill="#000000" fill-opacity="0.15" d="M6 31h18v1h-18z"/>
    </g>
    <!-- left pincer fused with the body (rest spot and sliding along the body side) -->
    <g id="arm-l">
      <path fill="#6B3122" d="M0 15h5v1h-5zM-1 16h1v1h-1zM-1 17h2v1h-2zM1 18h1v2h-1zM-1 20h2v1h-2zM-1 21h1v1h-1zM0 22h5v1h-5z"/>
      <path fill="#F3AC90" d="M1 16h4v1h-4zM1 20h1v1h-1z"/>
      <path fill="#B8644B" d="M0 16h1v1h-1zM1 17h1v1h-1zM0 21h5v1h-5z"/>
      <path fill="#DE886D" d="M2 17h3v4h-3z"/>
    </g>
    <!-- right pincer fused with the body (rest spot and sliding along the body side) -->
    <g id="arm-r">
      <path fill="#B8644B" d="M29 16h1v1h-1zM28 17h1v1h-1zM25 21h5v1h-5z"/>
      <path fill="#6B3122" d="M25 15h5v1h-5zM30 16h1v1h-1zM29 17h2v1h-2zM28 18h1v2h-1zM29 20h2v1h-2zM30 21h1v1h-1zM25 22h5v1h-5z"/>
      <path fill="#F3AC90" d="M25 16h4v1h-4zM28 20h1v1h-1z"/>
      <path fill="#DE886D" d="M25 17h3v4h-3z"/>
    </g>
    <!-- eyes squinted, 2x2 -->
    <g id="eyes-squint">
      <path fill="#1B1311" d="M8 17h2v2h-2zM20 17h2v2h-2z"/>
    </g>
    <!-- eyes shut, line at mid height -->
    <g id="eyes-shut-hi">
      <path fill="#1B1311" d="M8 18h2v1h-2zM20 18h2v1h-2z"/>
    </g>
    <!-- leg 1, 4 px long -->
    <g id="leg1-n4">
      <path fill="#B8644B" d="M6 26h1v3h-1z"/>
      <path fill="#6B3122" d="M7 26h1v3h-1zM6 29h2v1h-2z"/>
    </g>
    <!-- leg 2, 4 px long -->
    <g id="leg2-n4">
      <path fill="#B8644B" d="M10 26h1v3h-1z"/>
      <path fill="#6B3122" d="M11 26h1v3h-1zM10 29h2v1h-2z"/>
    </g>
    <!-- leg 3, 4 px long -->
    <g id="leg3-n4">
      <path fill="#B8644B" d="M18 26h1v3h-1z"/>
      <path fill="#6B3122" d="M19 26h1v3h-1zM18 29h2v1h-2z"/>
    </g>
    <!-- leg 4, 4 px long -->
    <g id="leg4-n4">
      <path fill="#B8644B" d="M22 26h1v3h-1z"/>
      <path fill="#6B3122" d="M23 26h1v3h-1zM22 29h2v1h-2z"/>
    </g>
    <!-- body 24x13 -->
    <g id="torso-24x13">
      <path fill="#DE886D" d="M25 13h1v1h-1zM7 14h18v1h-18zM5 15h20v7h-20zM4 22h1v2h-1z"/>
      <path fill="#6B3122" d="M3 12h24v1h-24zM3 13h1v11h-1zM26 13h1v11h-1zM3 24h24v1h-24z"/>
      <path fill="#B8644B" d="M25 14h1v8h-1zM5 22h21v2h-21z"/>
      <path fill="#F3AC90" d="M4 13h21v1h-21zM4 14h1v8h-1z"/>
      <path fill="#FFD3C2" d="M5 14h2v1h-2z"/>
    </g>
    <!-- leg 1, 5 px long -->
    <g id="leg1-n5">
      <path fill="#B8644B" d="M6 25h1v4h-1z"/>
      <path fill="#6B3122" d="M7 25h1v4h-1zM6 29h2v1h-2z"/>
    </g>
    <!-- leg 2, 5 px long -->
    <g id="leg2-n5">
      <path fill="#B8644B" d="M10 25h1v4h-1z"/>
      <path fill="#6B3122" d="M11 25h1v4h-1zM10 29h2v1h-2z"/>
    </g>
    <!-- leg 3, 5 px long -->
    <g id="leg3-n5">
      <path fill="#B8644B" d="M18 25h1v4h-1z"/>
      <path fill="#6B3122" d="M19 25h1v4h-1zM18 29h2v1h-2z"/>
    </g>
    <!-- leg 4, 5 px long -->
    <g id="leg4-n5">
      <path fill="#B8644B" d="M22 25h1v4h-1z"/>
      <path fill="#6B3122" d="M23 25h1v4h-1zM22 29h2v1h-2z"/>
    </g>
    <!-- ===== props used by this animation ===== -->
    <!-- credit card 16x10: steel body, dark stripe, gold chip, outline #2A1E1A -->
    <g id="card">
      <path fill="#2A1E1A" d="M7 1h16v1h-16zM7 11h16v1h-16zM6 2h1v9h-1zM23 2h1v9h-1z"/>
      <path fill="#A9B2BC" d="M7 2h16v9h-16z"/>
      <path fill="#DCE2E8" d="M7 2h16v1h-16z"/>
      <path fill="#6B737D" d="M7 10h16v1h-16z"/>
      <path fill="#2F353C" d="M7 4h16v2h-16z"/>
      <path fill="#F2B630" d="M8 8h3v2h-3z"/>
      <path fill="#C98918" d="M8 9h3v1h-3z"/>
      <path fill="#6B737D" d="M14 9h7v1h-7z"/>
    </g>
    <!-- red declined X over the card -->
    <g id="decl">
      <path fill="#FF4444" d="M11 3h1v1h-1zM11 9h1v1h-1zM12 3h1v1h-1zM12 4h1v1h-1zM12 8h1v1h-1zM12 9h1v1h-1zM13 4h1v1h-1zM13 5h1v1h-1zM13 7h1v1h-1zM13 8h1v1h-1zM14 5h1v1h-1zM14 6h1v1h-1zM14 7h1v1h-1zM15 5h1v1h-1zM15 6h1v1h-1zM15 7h1v1h-1zM16 4h1v1h-1zM16 5h1v1h-1zM16 7h1v1h-1zM16 8h1v1h-1zM17 3h1v1h-1zM17 4h1v1h-1zM17 8h1v1h-1zM17 9h1v1h-1zM18 3h1v1h-1zM18 9h1v1h-1z"/>
    </g>
    <!-- small gold coin 3x3 -->
    <g id="coin">
      <path fill="#FFDB6E" d="M0 0h3v1h-3z"/>
      <path fill="#F2B630" d="M0 1h3v1h-3z"/>
      <path fill="#C98918" d="M0 2h3v1h-3z"/>
    </g>
    <!-- coin wings: two flap poses (up / down), 3 px per side, right side placed by the use -->
    <g id="wing-up">
      <path fill="#FFFFFF" d="M-2 -1h1v2h-1zM-1 0h1v1h-1z"/>
      <path fill="#8A94A0" d="M-2 1h1v1h-1z"/>
    </g>
    <g id="wing-dn">
      <path fill="#FFFFFF" d="M-2 2h1v-2h-1zM-1 1h1v1h-1z"/>
      <path fill="#8A94A0" d="M-2 0h1v-1h-1z"/>
    </g>
    <g id="coin-lg">
      <path fill="#FFDB6E" d="M1 0h2v1h-2zM0 1h1v2h-1z"/>
      <path fill="#F2B630" d="M1 1h3v2h-3z"/>
      <path fill="#C98918" d="M3 0h1v1h-1zM3 1h1v3h-1zM1 3h2v1h-2z"/>
    </g>
    <!-- tear -->
    <g id="tear">
      <path fill="#6FB6E8" d="M9 19h1v1h-1zM8 20h3v2h-3zM9 22h1v1h-1z"/>
      <path fill="#3F8FC8" d="M10 21h1v1h-1zM9 22h1v1h-1z"/>
      <path fill="#B5DEF5" d="M9 20h1v1h-1z"/>
      <path fill="#FFFFFF" d="M8 20h1v1h-1z"/>
    </g>
  </defs>
  <g transform="scale(.5)">
    <use href="#shadow"/>
    <g class="lgv5">
      <use href="#leg1-n5"/>
      <use href="#leg2-n5"/>
      <use href="#leg3-n5"/>
      <use href="#leg4-n5"/>
    </g>
    <g class="lgv4">
      <use href="#leg1-n4"/>
      <use href="#leg2-n4"/>
      <use href="#leg3-n4"/>
      <use href="#leg4-n4"/>
    </g>
    <g class="cardmv">
      <use href="#card"/>
      <g class="xk"><use href="#decl"/></g>
    </g>
    <g class="tmv">
      <use href="#torso-24x13"/>
    </g>
    <g class="arl"><use href="#arm-l"/></g>
    <g class="arr"><use href="#arm-r"/></g>
    <g class="tmv">
      <g class="eysq"><use href="#eyes-squint"/></g>
      <g class="eysh"><use href="#eyes-shut-hi"/></g>
    </g>
    <g class="coin1"><use href="#coin"/>
      <g class="wa"><use href="#wing-up"/><g transform="translate(4 0) scale(-1 1)"><use href="#wing-up"/></g></g>
      <g class="wb"><use href="#wing-dn"/><g transform="translate(4 0) scale(-1 1)"><use href="#wing-dn"/></g></g>
    </g>
    <g class="coin2"><use href="#coin-lg"/>
      <g class="wb"><use href="#wing-up"/><g transform="translate(5 0) scale(-1 1)"><use href="#wing-up"/></g></g>
      <g class="wa"><use href="#wing-dn"/><g transform="translate(5 0) scale(-1 1)"><use href="#wing-dn"/></g></g>
    </g>
    <g class="coin3"><use href="#coin"/>
      <g class="wa"><use href="#wing-up"/><g transform="translate(4 0) scale(-1 1)"><use href="#wing-up"/></g></g>
      <g class="wb"><use href="#wing-dn"/><g transform="translate(4 0) scale(-1 1)"><use href="#wing-dn"/></g></g>
    </g>
    <g class="coin4"><use href="#coin"/>
      <g class="wb"><use href="#wing-up"/><g transform="translate(4 0) scale(-1 1)"><use href="#wing-up"/></g></g>
      <g class="wa"><use href="#wing-dn"/><g transform="translate(4 0) scale(-1 1)"><use href="#wing-dn"/></g></g>
    </g>
    <g class="coin5"><use href="#coin-lg"/>
      <g class="wa"><use href="#wing-up"/><g transform="translate(5 0) scale(-1 1)"><use href="#wing-up"/></g></g>
      <g class="wb"><use href="#wing-dn"/><g transform="translate(5 0) scale(-1 1)"><use href="#wing-dn"/></g></g>
