<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <!-- Clawd v2 (web) dizzy — 3 s loop.
       Motion reference: clawd-on-desk dizzy. Spiral eyes that spin, the upper body wobbles
       on a small clockwise ellipse with a light tilt (feet nearly planted), pincers dangle
       out of phase, three yellow stars orbit above the head, blue specks flicker near the
       face. v2 look: outline, light/shade, palette. Website only. -->
  <defs>
    <style>
      .body   { transform-box: fill-box; transform-origin: 50% 100%; animation: orbit 3s linear infinite; }
      .feet   { animation: feet 3s linear infinite; }
      .shadow { transform-box: fill-box; transform-origin: 50% 50%; animation: shadow 3s linear infinite; }
      .arm-l  { transform-box: fill-box; transform-origin: 100% 50%; animation: dangle 3s linear infinite; }
      .arm-r  { transform-box: fill-box; transform-origin: 0% 50%;   animation: dangle 3s linear infinite -1.5s; }
      .eye    { transform-box: fill-box; transform-origin: 50% 50%; animation: spin 1.2s linear infinite; }
      .star   { animation: star 3s linear infinite; }
      .s2 { animation-delay: -1s; }
      .s3 { animation-delay: -2s; }
      .dot  { animation: flick 1.4s linear infinite; }
      .d2 { animation-duration: 1.7s; animation-delay: -0.6s; }
      .d3 { animation-duration: 1.9s; animation-delay: -1s; }

      @keyframes orbit {
        0%   { transform: translate(0, -1px) rotate(0deg); }
        25%  { transform: translate(1.5px, 0) rotate(4deg); }
        50%  { transform: translate(0, 1px) rotate(0deg); }
        75%  { transform: translate(-1.5px, 0) rotate(-4deg); }
        100% { transform: translate(0, -1px) rotate(0deg); }
      }
      @keyframes feet {
        0%, 100% { transform: translate(0, 0); }
        25% { transform: translate(0.5px, 0); }
        75% { transform: translate(-0.5px, 0); }
      }
      @keyframes shadow {
        0%, 50%, 100% { transform: scaleX(1); }
        25%, 75% { transform: scaleX(0.92); }
      }
      @keyframes dangle {
        0%   { transform: translateY(0) rotate(0deg); }
        25%  { transform: translateY(1px) rotate(-10deg); }
        50%  { transform: translateY(0) rotate(0deg); }
        75%  { transform: translateY(-1px) rotate(10deg); }
        100% { transform: translateY(0) rotate(0deg); }
      }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      /* ellipse over the head: centre (15, 7), rx 9, ry 2; the back of the orbit shrinks */
      @keyframes star {
        0%   { transform: translate(15px, 5px)  scale(1);   opacity: 1; }
        25%  { transform: translate(24px, 7px)  scale(1);   opacity: 1; }
        50%  { transform: translate(15px, 9px)  scale(0.7); opacity: 0.6; }
        75%  { transform: translate(6px, 7px)   scale(1);   opacity: 1; }
        100% { transform: translate(15px, 5px)  scale(1);   opacity: 1; }
      }
      @keyframes flick {
        0%, 100% { opacity: 0; transform: translate(0, 0); }
        30% { opacity: 0.95; transform: translate(0.5px, -0.5px); }
        60% { opacity: 0.95; transform: translate(1px, 0); }
        90% { opacity: 0; transform: translate(0.5px, 0.5px); }
      }
    </style>

    <!-- ===== v2 rig ===== -->
    <g id="leg1"><path fill="#B8644B" d="M6 18h1v11h-1z"/><path fill="#6B3122" d="M7 18h1v11h-1zM6 29h2v1h-2z"/></g>
    <g id="leg2"><path fill="#B8644B" d="M10 18h1v11h-1z"/><path fill="#6B3122" d="M11 18h1v11h-1zM10 29h2v1h-2z"/></g>
    <g id="leg3"><path fill="#B8644B" d="M18 18h1v11h-1z"/><path fill="#6B3122" d="M19 18h1v11h-1zM18 29h2v1h-2z"/></g>
    <g id="leg4"><path fill="#B8644B" d="M22 18h1v11h-1z"/><path fill="#6B3122" d="M23 18h1v11h-1zM22 29h2v1h-2z"/></g>
    <g id="torso">
      <path fill="#DE886D" d="M24 13h1v1h-1zM8 14h16v1h-16zM6 15h18v8h-18zM5 23h1v2h-1z"/>
      <path fill="#B8644B" d="M24 14h1v9h-1zM6 23h19v2h-19z"/>
      <path fill="#6B3122" d="M4 12h22v1h-22zM4 13h1v12h-1zM25 13h1v12h-1zM4 25h22v1h-22z"/>
      <path fill="#F3AC90" d="M5 13h19v1h-19zM5 14h1v9h-1z"/>
      <path fill="#FFD3C2" d="M6 14h2v1h-2z"/>
    </g>
    <g id="arm-l">
      <path fill="#6B3122" d="M0 15h5v1h-5zM-1 16h1v1h-1zM-1 17h2v1h-2zM1 18h1v2h-1zM-1 20h2v1h-2zM-1 21h1v1h-1zM0 22h5v1h-5z"/>
      <path fill="#F3AC90" d="M1 16h4v1h-4zM1 20h1v1h-1z"/>
      <path fill="#B8644B" d="M0 16h1v1h-1zM1 17h1v1h-1zM0 21h5v1h-5z"/>
      <path fill="#DE886D" d="M2 17h3v4h-3z"/>
    </g>
    <g id="arm-r">
      <path fill="#B8644B" d="M29 16h1v1h-1zM28 17h1v1h-1zM25 21h5v1h-5z"/>
      <path fill="#6B3122" d="M25 15h5v1h-5zM30 16h1v1h-1zM29 17h2v1h-2zM28 18h1v2h-1zM29 20h2v1h-2zM30 21h1v1h-1zM25 22h5v1h-5z"/>
      <path fill="#F3AC90" d="M25 16h4v1h-4zM28 20h1v1h-1z"/>
      <path fill="#DE886D" d="M25 17h3v4h-3z"/>
    </g>
    <!-- spiral eye: alternating half-circles around (0,0), round stroke -->
    <g id="spiral">
      <path fill="none" stroke="#1B1311" stroke-width="0.9" stroke-linecap="round"
            d="M0 0a0.55 0.55 0 0 1 1.1 0a1.1 1.1 0 0 1 -2.2 0a1.65 1.65 0 0 1 3.3 0a2.2 2.2 0 0 1 -4.4 0"/>
    </g>
    <!-- 4-point star -->
    <g id="star" fill="#FFD84D">
      <path d="M-0.5 -1.5h1v3h-1zM-1.5 -0.5h3v1h-3z"/>
      <path fill="#FFF3B0" d="M-0.5 -0.5h1v1h-1z"/>
    </g>
  </defs>

  <g transform="scale(.5)">
    <path class="shadow" fill="#000000" fill-opacity="0.3" d="M3 30h24v1h-24z"/>
    <g class="feet">
      <use href="#leg1"/><use href="#leg2"/><use href="#leg3"/><use href="#leg4"/>
    </g>
    <g class="body">
      <use href="#torso"/>
      <g class="arm-l"><use href="#arm-l"/></g>
      <g class="arm-r"><use href="#arm-r"/></g>
      <g transform="translate(9 18)"><g class="eye"><use href="#spiral"/></g></g>
      <g transform="translate(21 18)"><g class="eye" style="animation-direction: reverse"><use href="#spiral"/></g></g>
    </g>
    <g class="star"><use href="#star"/></g>
    <g class="star s2"><use href="#star"/></g>
    <g class="star s3"><use href="#star"/></g>
    <g fill="#88B8E0">
      <g transform="translate(7 9)"><rect class="dot" width="1" height="1"/></g>
      <g transform="translate(22 9)"><rect class="dot d2" width="1" height="1"/></g>
      <g transform="translate(15 7)"><rect class="dot d3" width="1" height="1"/></g>
    </g>
  </g>
</svg>
