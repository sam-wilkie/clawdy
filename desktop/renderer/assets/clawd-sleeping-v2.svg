<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -20 40 40" width="500" height="500">
  <!-- Clawd v2 sleeping: 6 s loop at 6 fps (36 frames). Sploot pose, two slow breaths per loop (the v1 4.5 s breath did not loop), three Zs floating up on the original 6 s cycle. -->
