<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <!-- Clawd v2 beacon (MCP signal): 2 s loop at 8 fps (16 frames). Grid-aligned per the v2 ART BIBLE
       (1 art px = 0.5 SVG unit, art inside scale(.5), integer art-pixel moves only, no rotation/scaling,
       so nothing is anti-aliased and the frames downscale to exact 2x2 blocks). A steel antenna rises from
       the head with a blinking red tip; three concentric signal rings of 2x2 bits pulse outward in phase. -->
  <defs>
    <style>
      .bob { animation: bob 2s infinite step-end; }
      .tip { animation: tip 0.8s infinite step-end; }
      .ring1 { animation: ring1 2s infinite step-end; }
      .ring2 { animation: ring2 2s infinite step-end; }
      .ring3 { animation: ring3 2s infinite step-end; }
      @keyframes bob {
        0%   { transform: translate(0px, 0px); }
        25%  { transform: translate(0px, 1px); }
        75%  { transform: translate(0px, 0px); }
      }
      /* Antenna tip blinks red to bright, ~2.5 Hz against the 8 fps grid */
      @keyframes tip {
        0%   { opacity: 1; }
        50%  { opacity: 0; }
      }
      /* Each ring fades in near the antenna, holds while the next ring takes over, then clears.
         The three rings are offset by ~1/3 of the loop so a wave reads as travelling outward. */
      @keyframes ring1 {
        0%     { opacity: 1; }
        37.5%  { opacity: 0; }
        100%   { opacity: 0; }
      }
      @keyframes ring2 {
        0%     { opacity: 0; }
        31.25% { opacity: 1; }
        68.75% { opacity: 0; }
      }
      @keyframes ring3 {
        0%     { opacity: 0; }
        62.5%  { opacity: 1; }
        100%   { opacity: 0; }
      }
    </style>

    <!-- ===== rig: shared Clawd v2 parts, identical in every clawd-*-v2.svg (see clawd-static-base-v2.svg) ===== -->
    <!-- ground shadow, two translucent rows -->
    <g id="shadow">
      <path fill="#000000" fill-opacity="0.3" d="M3 30h24v1h-24z"/>
      <path fill="#000000" fill-opacity="0.15" d="M6 31h18v1h-18z"/>
    </g>
    <!-- leg 1 of 4 (drawn tall; the top is hidden behind the body) -->
    <g id="leg1">
      <path fill="#B8644B" d="M6 18h1v11h-1z"/>
      <path fill="#6B3122" d="M7 18h1v11h-1zM6 29h2v1h-2z"/>
    </g>
    <!-- leg 2 of 4 (drawn tall; the top is hidden behind the body) -->
    <g id="leg2">
      <path fill="#B8644B" d="M10 18h1v11h-1z"/>
      <path fill="#6B3122" d="M11 18h1v11h-1zM10 29h2v1h-2z"/>
    </g>
    <!-- leg 3 of 4 (drawn tall; the top is hidden behind the body) -->
    <g id="leg3">
      <path fill="#B8644B" d="M18 18h1v11h-1z"/>
      <path fill="#6B3122" d="M19 18h1v11h-1zM18 29h2v1h-2z"/>
    </g>
    <!-- leg 4 of 4 (drawn tall; the top is hidden behind the body) -->
    <g id="leg4">
      <path fill="#B8644B" d="M22 18h1v11h-1z"/>
      <path fill="#6B3122" d="M23 18h1v11h-1zM22 29h2v1h-2z"/>
    </g>
    <!-- body: 1 px outline, light top/left, shade bottom/right, specular dot -->
    <g id="torso">
      <path fill="#DE886D" d="M24 13h1v1h-1zM8 14h16v1h-16zM6 15h18v8h-18zM5 23h1v2h-1z"/>
      <path fill="#B8644B" d="M24 14h1v9h-1zM6 23h19v2h-19z"/>
      <path fill="#6B3122" d="M4 12h22v1h-22zM4 13h1v12h-1zM25 13h1v12h-1zM4 25h22v1h-22z"/>
      <path fill="#F3AC90" d="M5 13h19v1h-19zM5 14h1v9h-1z"/>
      <path fill="#FFD3C2" d="M6 14h2v1h-2z"/>
    </g>
    <!-- left pincer fused with the body (rest spot and sliding along the body side) -->
    <g id="arm-l">
      <path fill="#6B3122" d="M0 15h5v1h-5zM-1 16h1v1h-1zM-1 17h2v1h-2zM1 18h1v2h-1zM-1 20h2v1h-2zM-1 21h1v1h-1zM0 22h5v1h-5z"/>
      <path fill="#F3AC90" d="M1 16h4v1h-4zM1 20h1v1h-1z"/>
      <path fill="#B8644B" d="M0 16h1v1h-1zM1 17h1v1h-1zM0 21h5v1h-5z"/>
      <path fill="#DE886D" d="M2 17h3v4h-3z"/>
    </g>
    <!-- right pincer fused with the body (rest spot and sliding along the body side) -->
    <g id="arm-r">
      <path fill="#B8644B" d="M29 16h1v1h-1zM28 17h1v1h-1zM25 21h5v1h-5z"/>
      <path fill="#6B3122" d="M25 15h5v1h-5zM30 16h1v1h-1zM29 17h2v1h-2zM28 18h1v2h-1zM29 20h2v1h-2zM30 21h1v1h-1zM25 22h5v1h-5z"/>
      <path fill="#F3AC90" d="M25 16h4v1h-4zM28 20h1v1h-1z"/>
      <path fill="#DE886D" d="M25 17h3v4h-3z"/>
    </g>
    <!-- eyes 2x4 with a white highlight -->
    <g id="eyes-open">
      <path fill="#FFFFFF" d="M8 16h1v1h-1zM20 16h1v1h-1z"/>
      <path fill="#1B1311" d="M9 16h1v1h-1zM21 16h1v1h-1zM8 17h2v3h-2zM20 17h2v3h-2z"/>
    </g>

    <!-- ===== props used by this animation ===== -->
    <!-- Steel antenna shaft rising from the head centre (x 14-15), with a 1px outline and a steel highlight. -->
    <g id="antenna">
      <path fill="#6B737D" d="M14 6h2v7h-2z"/>
      <path fill="#A9B2BC" d="M14 6h1v7h-1z"/>
      <path fill="#DCE2E8" d="M14 7h1v2h-1z"/>
    </g>
    <!-- Blinking tip: a 2x2 red bit with a bright top-left highlight. -->
    <g id="tip">
      <path fill="#FF5A5F" d="M14 3h2v2h-2z"/>
      <path fill="#FFA3A6" d="M14 3h1v1h-1z"/>
    </g>
    <!-- Signal rings: concentric 2x2 bits around the tip (centre at art px 15,4), one colour per ring. -->
    <!-- ring 1 (near): blue, four bits one step out -->
    <g id="ring1">
      <path fill="#3D8BFD" d="M11 3h2v2h-2zM17 3h2v2h-2zM14 0h2v2h-2zM14 7h2v2h-2z"/>
      <path fill="#9CC4FF" d="M11 3h1v1h-1zM17 3h1v1h-1zM14 0h1v1h-1zM14 7h1v1h-1z"/>
    </g>
    <!-- ring 2 (mid): yellow, four bits two steps out -->
    <g id="ring2">
      <path fill="#FFC93C" d="M8 3h2v2h-2zM20 3h2v2h-2zM14 -3h2v2h-2zM14 10h2v2h-2z"/>
      <path fill="#FFE9A3" d="M8 3h1v1h-1zM20 3h1v1h-1zM14 -3h1v1h-1zM14 10h1v1h-1z"/>
    </g>
    <!-- ring 3 (far): red, four bits three steps out -->
    <g id="ring3">
      <path fill="#FF5A5F" d="M5 3h2v2h-2zM23 3h2v2h-2zM14 -6h2v2h-2zM14 13h2v2h-2z"/>
      <path fill="#FFA3A6" d="M5 3h1v1h-1zM23 3h1v1h-1zM14 -6h1v1h-1zM14 13h1v1h-1z"/>
    </g>
  </defs>

  <g transform="scale(.5)">
    <use href="#shadow"/>
    <use href="#leg1"/>
    <use href="#leg2"/>
    <use href="#leg3"/>
    <use href="#leg4"/>
    <g class="bob">
      <!-- signal rings expand outward from the antenna tip -->
      <g class="ring1"><use href="#ring1"/></g>
      <g class="ring2"><use href="#ring2"/></g>
      <g class="ring3"><use href="#ring3"/></g>
      <use href="#antenna"/>
      <g class="tip"><use href="#tip"/></g>
      <use href="#torso"/>
      <use href="#arm-l"/>
      <use href="#arm-r"/>
      <use href="#eyes-open"/>
    </g>
  </g>
</svg>
