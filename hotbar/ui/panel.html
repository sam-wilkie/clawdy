<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clawdy · Uso</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="panel.js"></script>
</head>
<body class="panel-window">
  <main class="panel" aria-label="Uso de agentes">
    <header class="phead">
      <div class="prow"><div id="segments" class="seg" role="group" aria-label="Rango"></div>
        <button id="close" class="x" type="button" aria-label="Cerrar panel" title="Cerrar">×</button></div>
      <div class="summary"><span id="range"></span><b id="spend"></b><span id="fresh" class="fresh" role="status"></span></div>
    </header>
    <div id="agents" class="pbody" tabindex="0" aria-label="Agentes"></div>
  </main>
</body>
</html>
