[package]
name = "clawdy-hotbar"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = "=2.7.2"

[dependencies]
tauri = "=2.12.3"
tauri-plugin-single-instance = "2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }
