name: Release

# Builds both desktop installers and attaches them to the GitHub release:
#
#   Margarita-Tank.dmg          macOS (Apple Silicon) menu bar app + Electron pet
#   Margarita-Tank-Setup.exe    Windows tray app (per-user Inno Setup installer)
#
# Asset names carry no version on purpose, so the README can link to
# https://github.com/sam-wilkie/margarita-tank/releases/latest/download/<asset>.
#
# Triggers:
#   - pushing a vX.Y.Z tag (the normal flow, see .claude/skills/releasing):
#     creates the release with both assets.
#   - publishing a release from the GitHub UI: attaches the assets to it. A
#     release created by this workflow's own token does not re-trigger it, and
#     the concurrency group below serialises a tag push + UI publish of the same
#     tag; re-uploads overwrite the same file names, never add duplicates.
#   - workflow_dispatch: builds both installers as run artifacts only.

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  LVGL_SHA: 85aa60d18b3d5e5588d7b247abf90198f07c8a63

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Electron runtime
        working-directory: desktop
        run: |
          corepack enable
          corepack prepare pnpm@9.15.5 --activate
          pnpm install --frozen-lockfile

      - name: Fetch LVGL (managed component not in git)
        run: |
          mkdir -p firmware/managed_components
          git clone --depth 1 https://github.com/lvgl/lvgl.git firmware/managed_components/lvgl__lvgl
          cd firmware/managed_components/lvgl__lvgl
          git fetch --depth 1 origin "$LVGL_SHA"
          git checkout "$LVGL_SHA"

      - name: Build static simulator
        run: |
          cd simulator
          cmake -B build-static -DSTATIC_SDL2=ON
          cmake --build build-static
          # Verify no SDL2 dynamic dependency
          otool -L build-static/clawd-tank-sim > /tmp/otool-out.txt
          if grep -qi sdl /tmp/otool-out.txt; then
            echo "ERROR: SDL2 dynamic dependency found"
            cat /tmp/otool-out.txt
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: host
        run: |
          pip install -r requirements.txt
          pip install py2app

      - name: Build .app with py2app
        working-directory: host
        run: python setup.py py2app

      - name: Bundle Electron desktop pet
        run: |
          resources="host/dist/Margarita Tank.app/Contents/Resources/desktop"
          mkdir -p "$resources/node_modules/electron/dist"
          cp desktop/main.js desktop/preload.js desktop/daemon-bridge.js "$resources/"
          cp -R desktop/renderer "$resources/renderer"
          cp desktop/node_modules/electron/path.txt "$resources/node_modules/electron/path.txt"
          cp desktop/node_modules/electron/package.json "$resources/node_modules/electron/package.json"
          cp -R desktop/node_modules/electron/dist/Electron.app "$resources/node_modules/electron/dist/Electron.app"

      - name: Check the bundled Electron desktop pet
        run: |
          resources="host/dist/Margarita Tank.app/Contents/Resources/desktop"
          test -f "$resources/main.js"
          test -f "$resources/renderer/index.html"
          test -x "$resources/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron"

      - name: Check the bundled Claude Code mod
        # hooks.resolve_mod_source() reads it from Contents/Resources/claude-mod.
        run: |
          test -f "host/dist/Margarita Tank.app/Contents/Resources/claude-mod/margarita-band/.claude-plugin/plugin.json" \
            || { echo "ERROR: the Claude Code mod is missing from the app bundle"; exit 1; }

      - name: Bundle simulator into app
        # Contents/Resources/ is where sim_process.py looks first (helper
        # binaries in Contents/MacOS/ can be mistaken for the main executable).
        run: |
          cp simulator/build-static/clawd-tank-sim "host/dist/Margarita Tank.app/Contents/Resources/clawd-tank-sim"

      - name: Ad-hoc sign app bundle
        # Copying the simulator in breaks the seal py2app signed; a downloaded
        # app with a broken signature is reported as "damaged" by Gatekeeper.
        run: |
          codesign --force --deep --sign - "host/dist/Margarita Tank.app"
          codesign --verify --deep --strict --verbose=2 "host/dist/Margarita Tank.app"

      - name: Create DMG
        working-directory: host
        run: |
          mkdir -p dmg-staging
          cp -R "dist/Margarita Tank.app" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          # hdiutil intermittently fails with "Resource busy" on hosted
          # runners (a system process holds the volume); retry a few times.
          for attempt in 1 2 3 4 5; do
            if hdiutil create -volname "Margarita Tank" \
                -srcfolder dmg-staging \
                -ov -format UDZO \
                "dist/Margarita-Tank.dmg"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "hdiutil create failed after $attempt attempts" >&2
              exit 1
            fi
            echo "hdiutil create failed (attempt $attempt), retrying in 10s..."
            sleep 10
          done
          rm -rf dmg-staging

      - name: Upload DMG as artifact
        uses: actions/upload-artifact@v7
        with:
          name: Margarita-Tank-macOS
          path: host/dist/Margarita-Tank.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Set up MinGW-w64 toolchain
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-x86_64-gcc
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Fetch LVGL (managed component not in git)
        run: |
          mkdir -p firmware/managed_components
          git clone --depth 1 https://github.com/lvgl/lvgl.git firmware/managed_components/lvgl__lvgl
          cd firmware/managed_components/lvgl__lvgl
          git fetch --depth 1 origin "$LVGL_SHA"
          git checkout "$LVGL_SHA"

      - name: Build static simulator
        run: |
          cd simulator
          cmake -B build-static -G Ninja -DSTATIC_SDL2=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Release
          cmake --build build-static
          # Verify no SDL2 / MinGW runtime dynamic dependency
          objdump -p build-static/clawd-tank-sim.exe > objdump-out.txt
          if grep -qiE 'DLL Name:.*(sdl2|libwinpthread|libgcc)' objdump-out.txt; then
            echo "ERROR: dynamic dependency found"
            cat objdump-out.txt
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: host
        run: |
          pip install -r requirements.txt
          pip install "pyinstaller>=6.0,<7"

      - name: Build tray app with PyInstaller
        # The spec bundles simulator/build-static/clawd-tank-sim.exe.
        working-directory: host
        run: python -m PyInstaller windows/margarita_tank.spec --noconfirm

      - name: Check the build
        working-directory: host/dist/MargaritaTank
        run: |
          for f in MargaritaTank.exe margarita-notify.exe margarita-statusline.exe clawd-tank-sim.exe MargaritaTank.ico; do
            test -f "$f" || { echo "ERROR: missing $f"; exit 1; }
          done
          # The Claude Code mod the menu toggle installs ships next to the exe.
          test -f claude-mod/margarita-band/.claude-plugin/plugin.json \
            || { echo "ERROR: missing the Claude Code mod"; exit 1; }
          # The hook handler must run standalone and exit 0 on an ignored event.
          echo '{"hook_event_name":"Ignored"}' | ./margarita-notify.exe
          # The statusLine bridge must run standalone, exit 0 and print nothing
          # when no original statusLine was saved.
          out=$(echo '{"rate_limits":{}}' | CLAWD_TANK_DIR="$RUNNER_TEMP/clawd" ./margarita-statusline.exe)
          test -z "$out" || { echo "ERROR: unexpected statusline output: $out"; exit 1; }
          test -f "$RUNNER_TEMP/clawd/statusline-cache.json" || { echo "ERROR: bridge wrote no cache"; exit 1; }

      - name: Derive installer version
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "APP_VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.0" >> "$GITHUB_ENV"
          fi

      - name: Build installer with Inno Setup
        shell: pwsh
        working-directory: host
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $iscc "/DAppVersion=$env:APP_VERSION" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v7
        with:
          name: Margarita-Tank-Windows
          path: host/dist/Margarita-Tank-Setup.exe
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Attach installers to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            assets/Margarita-Tank.dmg
            assets/Margarita-Tank-Setup.exe
