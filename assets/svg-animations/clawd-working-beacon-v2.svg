      <g opacity="1"><path fill="#3DD6F5" d="M12 2h1v1h-1zM12 5h1v1h-1zM17 2h1v1h-1zM17 5h1v1h-1z"/><path fill="#B8F1FF" d="M11 3h1v1h-1zM11 4h1v1h-1zM18 3h1v1h-1zM18 4h1v1h-1z"/></g>
      </g>
      <g class="w13">
      <g opacity="0.85"><path fill="#3DD6F5" d="M3 1h1v1h-1zM2 2h1v1h-1zM2 5h1v1h-1zM3 6h1v1h-1zM26 1h1v1h-1zM27 2h1v1h-1zM27 5h1v1h-1zM26 6h1v1h-1z"/><path fill="#B8F1FF" d="M1 3h1v1h-1zM1 4h1v1h-1zM28 3h1v1h-1zM28 4h1v1h-1z"/></g>
      <g opacity="1"><path fill="#3DD6F5" d="M10 2h1v1h-1zM10 5h1v1h-1zM19 2h1v1h-1zM19 5h1v1h-1z"/><path fill="#B8F1FF" d="M9 3h1v1h-1zM9 4h1v1h-1zM20 3h1v1h-1zM20 4h1v1h-1z"/></g>
