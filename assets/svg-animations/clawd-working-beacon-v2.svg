<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <!-- Clawd v2 beacon (MCP signal): 2 s loop at 8 fps (16 frames). Grid-aligned per the v2 ART BIBLE
       (1 art px = 0.5 SVG unit, art inside scale(.5), integer art-pixel moves only, no rotation/scaling,
       so nothing is anti-aliased and the frames downscale to exact 2x2 blocks). The antenna tip flashes bright as each radio wave is emitted; cyan ((.)) arcs travel outward 2 px per frame (a new wave every 4 frames, 2 in flight), shrinking to dotted arcs and fading. The body dips on every emission and the eyes glance up toward the antenna. -->
  <defs>
    <style>
      .bob { animation: bob 2s infinite step-end; }
      .eyes { animation: eyes 2s infinite step-end; }
      .tbr { animation: tbr 2s infinite step-end; }
      .tdm { animation: tdm 2s infinite step-end; }
      .w0 { animation: w0 2s infinite step-end; }
      .w1 { animation: w1 2s infinite step-end; }
      .w2 { animation: w2 2s infinite step-end; }
      .w3 { animation: w3 2s infinite step-end; }
      .w4 { animation: w4 2s infinite step-end; }
      .w5 { animation: w5 2s infinite step-end; }
      .w6 { animation: w6 2s infinite step-end; }
      .w7 { animation: w7 2s infinite step-end; }
      .w8 { animation: w8 2s infinite step-end; }
      .w9 { animation: w9 2s infinite step-end; }
      .w10 { animation: w10 2s infinite step-end; }
      .w11 { animation: w11 2s infinite step-end; }
      .w12 { animation: w12 2s infinite step-end; }
      .w13 { animation: w13 2s infinite step-end; }
      .w14 { animation: w14 2s infinite step-end; }
      .w15 { animation: w15 2s infinite step-end; }
      @keyframes bob {
        0.0% { transform: translate(0px, 1px); }
        6.25% { transform: translate(0px, 0px); }
        25.0% { transform: translate(0px, 1px); }
        31.25% { transform: translate(0px, 0px); }
        50.0% { transform: translate(0px, 1px); }
        56.25% { transform: translate(0px, 0px); }
        75.0% { transform: translate(0px, 1px); }
        81.25% { transform: translate(0px, 0px); }
      }
      @keyframes eyes {
        0.0% { transform: translate(0px, 0px); }
        6.25% { transform: translate(0px, -1px); }
        18.75% { transform: translate(0px, 0px); }
        31.25% { transform: translate(0px, -1px); }
        43.75% { transform: translate(0px, 0px); }
        56.25% { transform: translate(0px, -1px); }
        68.75% { transform: translate(0px, 0px); }
        81.25% { transform: translate(0px, -1px); }
        93.75% { transform: translate(0px, 0px); }
      }
      @keyframes tbr {
        0.0% { opacity: 1; }
        6.25% { opacity: 0; }
        25.0% { opacity: 1; }
        31.25% { opacity: 0; }
        50.0% { opacity: 1; }
        56.25% { opacity: 0; }
        75.0% { opacity: 1; }
        81.25% { opacity: 0; }
      }
      @keyframes tdm {
        0.0% { opacity: 0; }
        12.5% { opacity: 1; }
        25.0% { opacity: 0; }
        37.5% { opacity: 1; }
        50.0% { opacity: 0; }
        62.5% { opacity: 1; }
        75.0% { opacity: 0; }
        87.5% { opacity: 1; }
      }
      @keyframes w0 {
        0.0% { opacity: 1; }
        6.25% { opacity: 0; }
      }
      @keyframes w1 {
        0.0% { opacity: 0; }
        6.25% { opacity: 1; }
        12.5% { opacity: 0; }
      }
      @keyframes w2 {
        0.0% { opacity: 0; }
        12.5% { opacity: 1; }
        18.75% { opacity: 0; }
      }
      @keyframes w3 {
        0.0% { opacity: 0; }
        18.75% { opacity: 1; }
        25.0% { opacity: 0; }
      }
      @keyframes w4 {
        0.0% { opacity: 0; }
        25.0% { opacity: 1; }
        31.25% { opacity: 0; }
      }
      @keyframes w5 {
        0.0% { opacity: 0; }
        31.25% { opacity: 1; }
        37.5% { opacity: 0; }
      }
      @keyframes w6 {
        0.0% { opacity: 0; }
        37.5% { opacity: 1; }
        43.75% { opacity: 0; }
      }
      @keyframes w7 {
        0.0% { opacity: 0; }
        43.75% { opacity: 1; }
        50.0% { opacity: 0; }
      }
      @keyframes w8 {
        0.0% { opacity: 0; }
        50.0% { opacity: 1; }
        56.25% { opacity: 0; }
      }
      @keyframes w9 {
        0.0% { opacity: 0; }
        56.25% { opacity: 1; }
        62.5% { opacity: 0; }
      }
      @keyframes w10 {
        0.0% { opacity: 0; }
        62.5% { opacity: 1; }
        68.75% { opacity: 0; }
      }
      @keyframes w11 {
        0.0% { opacity: 0; }
        68.75% { opacity: 1; }
        75.0% { opacity: 0; }
      }
      @keyframes w12 {
        0.0% { opacity: 0; }
        75.0% { opacity: 1; }
        81.25% { opacity: 0; }
      }
      @keyframes w13 {
        0.0% { opacity: 0; }
        81.25% { opacity: 1; }
        87.5% { opacity: 0; }
      }
      @keyframes w14 {
        0.0% { opacity: 0; }
        87.5% { opacity: 1; }
        93.75% { opacity: 0; }
      }
      @keyframes w15 {
        0.0% { opacity: 0; }
        93.75% { opacity: 1; }
      }
    </style>

    <!-- ===== rig: shared Clawd v2 parts, identical in every clawd-*-v2.svg (see clawd-static-base-v2.svg) ===== -->
    <!-- ground shadow, two translucent rows -->
    <g id="shadow">
      <path fill="#000000" fill-opacity="0.3" d="M3 30h24v1h-24z"/>
      <path fill="#000000" fill-opacity="0.15" d="M6 31h18v1h-18z"/>
    </g>
    <!-- leg 1 of 4 (drawn tall; the top is hidden behind the body) -->
    <g id="leg1">
      <path fill="#B8644B" d="M6 18h1v11h-1z"/>
      <path fill="#6B3122" d="M7 18h1v11h-1zM6 29h2v1h-2z"/>
    </g>
    <!-- leg 2 of 4 (drawn tall; the top is hidden behind the body) -->
    <g id="leg2">
      <path fill="#B8644B" d="M10 18h1v11h-1z"/>
      <path fill="#6B3122" d="M11 18h1v11h-1zM10 29h2v1h-2z"/>
    </g>
    <!-- leg 3 of 4 (drawn tall; the top is hidden behind the body) -->
    <g id="leg3">
      <path fill="#B8644B" d="M18 18h1v11h-1z"/>
      <path fill="#6B3122" d="M19 18h1v11h-1zM18 29h2v1h-2z"/>
    </g>
    <!-- leg 4 of 4 (drawn tall; the top is hidden behind the body) -->
    <g id="leg4">
      <path fill="#B8644B" d="M22 18h1v11h-1z"/>
      <path fill="#6B3122" d="M23 18h1v11h-1zM22 29h2v1h-2z"/>
    </g>
    <!-- body: 1 px outline, light top/left, shade bottom/right, specular dot -->
    <g id="torso">
      <path fill="#DE886D" d="M24 13h1v1h-1zM8 14h16v1h-16zM6 15h18v8h-18zM5 23h1v2h-1z"/>
      <path fill="#B8644B" d="M24 14h1v9h-1zM6 23h19v2h-19z"/>
      <path fill="#6B3122" d="M4 12h22v1h-22zM4 13h1v12h-1zM25 13h1v12h-1zM4 25h22v1h-22z"/>
      <path fill="#F3AC90" d="M5 13h19v1h-19zM5 14h1v9h-1z"/>
      <path fill="#FFD3C2" d="M6 14h2v1h-2z"/>
    </g>
    <!-- left pincer fused with the body (rest spot and sliding along the body side) -->
    <g id="arm-l">
      <path fill="#6B3122" d="M0 15h5v1h-5zM-1 16h1v1h-1zM-1 17h2v1h-2zM1 18h1v2h-1zM-1 20h2v1h-2zM-1 21h1v1h-1zM0 22h5v1h-5z"/>
      <path fill="#F3AC90" d="M1 16h4v1h-4zM1 20h1v1h-1z"/>
      <path fill="#B8644B" d="M0 16h1v1h-1zM1 17h1v1h-1zM0 21h5v1h-5z"/>
      <path fill="#DE886D" d="M2 17h3v4h-3z"/>
    </g>
    <!-- right pincer fused with the body (rest spot and sliding along the body side) -->
    <g id="arm-r">
      <path fill="#B8644B" d="M29 16h1v1h-1zM28 17h1v1h-1zM25 21h5v1h-5z"/>
      <path fill="#6B3122" d="M25 15h5v1h-5zM30 16h1v1h-1zM29 17h2v1h-2zM28 18h1v2h-1zM29 20h2v1h-2zM30 21h1v1h-1zM25 22h5v1h-5z"/>
      <path fill="#F3AC90" d="M25 16h4v1h-4zM28 20h1v1h-1z"/>
      <path fill="#DE886D" d="M25 17h3v4h-3z"/>
    </g>
    <!-- eyes 2x4 with a white highlight -->
    <g id="eyes-open">
      <path fill="#FFFFFF" d="M8 16h1v1h-1zM20 16h1v1h-1z"/>
      <path fill="#1B1311" d="M9 16h1v1h-1zM21 16h1v1h-1zM8 17h2v3h-2zM20 17h2v3h-2z"/>
    </g>

    <!-- ===== props used by this animation ===== -->
    <!-- Steel antenna shaft rising from the head centre (x 14-15), with a 1px outline and a steel highlight. -->
    <g id="antenna">
      <path fill="#6B737D" d="M14 6h2v7h-2z"/>
      <path fill="#A9B2BC" d="M14 6h1v7h-1z"/>
      <path fill="#DCE2E8" d="M14 7h1v2h-1z"/>
    </g>
    <!-- Blinking tip: a 2x2 red bit with a bright top-left highlight. -->
    <g id="tip">
      <path fill="#FF5A5F" d="M14 3h2v2h-2z"/>
      <path fill="#FFA3A6" d="M14 3h1v1h-1z"/>
    </g>
    <!-- Tip emission flash (bright when a wave leaves) and dim phase (after), over the base tip. -->
    <g id="tip-bright">
      <path fill="#FFC2C4" d="M14 3h2v2h-2z"/>
      <path fill="#FFFFFF" d="M14 3h1v1h-1z"/>
    </g>
    <g id="tip-dim">
      <path fill="#A93434" d="M14 3h2v2h-2z"/>
      <path fill="#C9494E" d="M14 3h1v1h-1z"/>
    </g>
  </defs>

  <g transform="scale(.5)">
    <use href="#shadow"/>
    <use href="#leg1"/>
    <use href="#leg2"/>
    <use href="#leg3"/>
    <use href="#leg4"/>
    <g class="bob">
      <!-- radio-wave arcs, 4 waves staggered every 4 frames, each travelling 2 px/frame outward for 8 frames, shrinking to dotted arcs and dimming -->
      <g class="w0">
      <g opacity="1"><path fill="#3DD6F5" d="M12 2h1v1h-1zM12 5h1v1h-1zM17 2h1v1h-1zM17 5h1v1h-1z"/><path fill="#B8F1FF" d="M11 3h1v1h-1zM11 4h1v1h-1zM18 3h1v1h-1zM18 4h1v1h-1z"/></g>
      <g opacity="0.85"><path fill="#3DD6F5" d="M5 1h1v1h-1zM4 2h1v1h-1zM4 5h1v1h-1zM5 6h1v1h-1zM24 1h1v1h-1zM25 2h1v1h-1zM25 5h1v1h-1zM24 6h1v1h-1z"/><path fill="#B8F1FF" d="M3 3h1v1h-1zM3 4h1v1h-1zM26 3h1v1h-1zM26 4h1v1h-1z"/></g>
      </g>
      <g class="w1">
      <g opacity="1"><path fill="#3DD6F5" d="M10 2h1v1h-1zM10 5h1v1h-1zM19 2h1v1h-1zM19 5h1v1h-1z"/><path fill="#B8F1FF" d="M9 3h1v1h-1zM9 4h1v1h-1zM20 3h1v1h-1zM20 4h1v1h-1z"/></g>
      <g opacity="0.85"><path fill="#3DD6F5" d="M3 1h1v1h-1zM2 2h1v1h-1zM2 5h1v1h-1zM3 6h1v1h-1zM26 1h1v1h-1zM27 2h1v1h-1zM27 5h1v1h-1zM26 6h1v1h-1z"/><path fill="#B8F1FF" d="M1 3h1v1h-1zM1 4h1v1h-1zM28 3h1v1h-1zM28 4h1v1h-1z"/></g>
      </g>
      <g class="w2">
      <g opacity="1"><path fill="#3DD6F5" d="M8 2h1v1h-1zM8 5h1v1h-1zM21 2h1v1h-1zM21 5h1v1h-1z"/><path fill="#B8F1FF" d="M7 3h1v1h-1zM7 4h1v1h-1zM22 3h1v1h-1zM22 4h1v1h-1z"/></g>
      <g opacity="0.5"><path fill="#3DD6F5" d="M1 1h1v1h-1zM1 6h1v1h-1zM28 1h1v1h-1zM28 6h1v1h-1z"/><path fill="#B8F1FF" d="M-1 3h1v1h-1zM-1 4h1v1h-1zM30 3h1v1h-1zM30 4h1v1h-1z"/></g>
      </g>
      <g class="w3">
      <g opacity="0.85"><path fill="#3DD6F5" d="M7 1h1v1h-1zM6 2h1v1h-1zM6 5h1v1h-1zM7 6h1v1h-1zM22 1h1v1h-1zM23 2h1v1h-1zM23 5h1v1h-1zM22 6h1v1h-1z"/><path fill="#B8F1FF" d="M5 3h1v1h-1zM5 4h1v1h-1zM24 3h1v1h-1zM24 4h1v1h-1z"/></g>
      <g opacity="0.3"><path fill="#3DD6F5" d="M-1 1h1v1h-1zM-1 6h1v1h-1zM30 1h1v1h-1zM30 6h1v1h-1z"/><path fill="#B8F1FF" d="M-3 3h1v1h-1zM-3 4h1v1h-1zM32 3h1v1h-1zM32 4h1v1h-1z"/></g>
      </g>
      <g class="w4">
      <g opacity="0.85"><path fill="#3DD6F5" d="M5 1h1v1h-1zM4 2h1v1h-1zM4 5h1v1h-1zM5 6h1v1h-1zM24 1h1v1h-1zM25 2h1v1h-1zM25 5h1v1h-1zM24 6h1v1h-1z"/><path fill="#B8F1FF" d="M3 3h1v1h-1zM3 4h1v1h-1zM26 3h1v1h-1zM26 4h1v1h-1z"/></g>
      <g opacity="1"><path fill="#3DD6F5" d="M12 2h1v1h-1zM12 5h1v1h-1zM17 2h1v1h-1zM17 5h1v1h-1z"/><path fill="#B8F1FF" d="M11 3h1v1h-1zM11 4h1v1h-1zM18 3h1v1h-1zM18 4h1v1h-1z"/></g>
      </g>
      <g class="w5">
      <g opacity="0.85"><path fill="#3DD6F5" d="M3 1h1v1h-1zM2 2h1v1h-1zM2 5h1v1h-1zM3 6h1v1h-1zM26 1h1v1h-1zM27 2h1v1h-1zM27 5h1v1h-1zM26 6h1v1h-1z"/><path fill="#B8F1FF" d="M1 3h1v1h-1zM1 4h1v1h-1zM28 3h1v1h-1zM28 4h1v1h-1z"/></g>
      <g opacity="1"><path fill="#3DD6F5" d="M10 2h1v1h-1zM10 5h1v1h-1zM19 2h1v1h-1zM19 5h1v1h-1z"/><path fill="#B8F1FF" d="M9 3h1v1h-1zM9 4h1v1h-1zM20 3h1v1h-1zM20 4h1v1h-1z"/></g>
      </g>
      <g class="w6">
      <g opacity="0.5"><path fill="#3DD6F5" d="M1 1h1v1h-1zM1 6h1v1h-1zM28 1h1v1h-1zM28 6h1v1h-1z"/><path fill="#B8F1FF" d="M-1 3h1v1h-1zM-1 4h1v1h-1zM30 3h1v1h-1zM30 4h1v1h-1z"/></g>
      <g opacity="1"><path fill="#3DD6F5" d="M8 2h1v1h-1zM8 5h1v1h-1zM21 2h1v1h-1zM21 5h1v1h-1z"/><path fill="#B8F1FF" d="M7 3h1v1h-1zM7 4h1v1h-1zM22 3h1v1h-1zM22 4h1v1h-1z"/></g>
      </g>
      <g class="w7">
