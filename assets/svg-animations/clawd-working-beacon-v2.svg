      <g opacity="0.85"><path fill="#3DD6F5" d="M7 1h1v1h-1zM6 2h1v1h-1zM6 5h1v1h-1zM7 6h1v1h-1zM22 1h1v1h-1zM23 2h1v1h-1zM23 5h1v1h-1zM22 6h1v1h-1z"/><path fill="#B8F1FF" d="M5 3h1v1h-1zM5 4h1v1h-1zM24 3h1v1h-1zM24 4h1v1h-1z"/></g>
