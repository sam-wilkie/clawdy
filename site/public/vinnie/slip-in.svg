<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <!-- Monster v2 slip-in: 1.4 s once, fill forwards, continuous motion (no pose swaps). Glances right, crouches, three decaying hops and a belly slide under the window edge; ends hidden at x = 64. X travel is one eased curve; hops, squash/stretch about the feet, face lag and mitten flaps are separate eased tracks. -->
  <defs>
    <style>
      .x, .y, .sq, .shx, .fy, .look, .hands, .hl, .hr, .vis { animation: 1.4s linear 1 forwards; }
      .sq, .shx { transform-box: view-box; transform-origin: 15px 30px; }
      .vis { animation-name: vis; }
      .x { animation-name: x; }
      .y { animation-name: y; }
      .sq { animation-name: sq; }
      .shx { animation-name: shx; }
      .fy { animation-name: fy; animation-timing-function: ease-in-out; }
      .look { animation-name: look; }
      .hands { animation-name: hands; }
      .hl { animation-name: hl; animation-timing-function: ease-in-out; }
      .hr { animation-name: hr; animation-timing-function: ease-in-out; }
      /* one eased travel curve; fully under the window from about 1.17 s */
      @keyframes x {
        0% { transform: translateX(0); animation-timing-function: cubic-bezier(0.4, 0, 0.85, 0.45); }
        100% { transform: translateX(64px); }
      }
      /* three decaying parabolas (5, 3.5, 2) with constant gravity: up ease-out, down ease-in */
      @keyframes y {
        0% { transform: translateY(0); }
        18.5714%, 42.8571%, 62.8571% { transform: translateY(0); animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
        28.5714% { transform: translateY(-5px); animation-timing-function: cubic-bezier(0.32, 0, 0.67, 0); }
        51.4286% { transform: translateY(-3.5px); animation-timing-function: cubic-bezier(0.32, 0, 0.67, 0); }
        69.2857% { transform: translateY(-2px); animation-timing-function: cubic-bezier(0.32, 0, 0.67, 0); }
        38.5714%, 60%, 75.7143%, 100% { transform: translateY(0); }
      }
      /* squash and stretch about the feet: crouch, launch stretch, decaying landing squash, belly slide */
      @keyframes sq {
        0%, 7.1429% { transform: scale(1, 1); animation-timing-function: ease-in-out; }
        18.5714% { transform: scale(1.08, 0.86); animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
        22.8571% { transform: scale(0.92, 1.1); animation-timing-function: ease-in-out; }
        28.5714% { transform: scale(1, 1); animation-timing-function: ease-in; }
        35.7143% { transform: scale(0.95, 1.06); animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
        38.5714% { transform: scale(1.12, 0.84); animation-timing-function: ease-in-out; }
        42.8571% { transform: scale(1.04, 0.94); animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
        47.1429% { transform: scale(0.94, 1.07); animation-timing-function: ease-in-out; }
        51.4286% { transform: scale(1, 1); animation-timing-function: ease-in; }
        57.1429% { transform: scale(0.97, 1.04); animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
        60% { transform: scale(1.08, 0.9); animation-timing-function: ease-in-out; }
        62.8571% { transform: scale(1.02, 0.97); animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
        65.7143% { transform: scale(0.97, 1.03); animation-timing-function: ease-in-out; }
        69.2857% { transform: scale(1, 1); animation-timing-function: ease-in; }
        72.8571% { transform: scale(0.98, 1.02); animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
        75.7143% { transform: scale(1.06, 0.92); animation-timing-function: ease-out; }
        81.4286%, 100% { transform: scale(1.18, 0.74); }
      }
      @keyframes shx {
        0%, 7.1429% { transform: scale(1, 1); opacity: 1; animation-timing-function: ease-in-out; }
        18.5714% { transform: scale(1.08, 1); opacity: 1; animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
        28.5714% { transform: scale(0.75, 1); opacity: 0.5; animation-timing-function: cubic-bezier(0.32, 0, 0.67, 0); }
        38.5714% { transform: scale(1.1, 1); opacity: 1; }
        42.8571% { transform: scale(1.04, 1); opacity: 1; animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
        51.4286% { transform: scale(0.82, 1); opacity: 0.65; animation-timing-function: cubic-bezier(0.32, 0, 0.67, 0); }
        60% { transform: scale(1.06, 1); opacity: 1; }
        62.8571% { transform: scale(1.02, 1); opacity: 1; animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
        69.2857% { transform: scale(0.9, 1); opacity: 0.8; animation-timing-function: cubic-bezier(0.32, 0, 0.67, 0); }
        75.7143% { transform: scale(1.04, 1); opacity: 1; animation-timing-function: ease-out; }
        81.4286%, 100% { transform: scale(1.2, 1); opacity: 1; }
      }
      /* the face lags the body by a hair */
      @keyframes fy {
        0%, 7.1429% { transform: translateY(0); }
        21.4286% { transform: translateY(1px); }
        30% { transform: translateY(-0.5px); }
        40% { transform: translateY(1.5px); }
        45.7143% { transform: translateY(0.5px); }
        52.8571% { transform: translateY(-0.5px); }
        61.4286% { transform: translateY(1px); }
        65.7143% { transform: translateY(0); }
        70.7143% { transform: translateY(-0.3px); }
        77.1429% { transform: translateY(1px); }
        82.8571%, 100% { transform: translateY(1.5px); }
      }
      @keyframes look {
        0% { transform: translateX(0); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
        7.1429%, 100% { transform: translateX(1px); }
      }
      @keyframes hands {
        0%, 3.5714% { opacity: 0; }
        10.7143%, 100% { opacity: 1; }
      }
      /* mittens tuck on the crouch and each landing, flap up on each launch, stretch out for the slide */
      @keyframes hl {
        0%, 7.1429% { transform: translate(-1px, 19px); }
        18.5714%, 38.5714%, 60%, 75.7143% { transform: translate(1px, 21px); }
        24.2857% { transform: translate(-3px, 14px); }
        30% { transform: translate(-2px, 16px); }
        45.7143% { transform: translate(-3px, 15px); }
        52.8571% { transform: translate(-2px, 17px); }
        65.7143% { transform: translate(-2px, 16px); }
        81.4286%, 100% { transform: translate(-4px, 21px); }
      }
      @keyframes hr {
        0%, 7.1429% { transform: translate(26px, 19px); }
        18.5714%, 38.5714%, 60%, 75.7143% { transform: translate(24px, 21px); }
        24.2857% { transform: translate(28px, 14px); }
        30% { transform: translate(27px, 16px); }
        45.7143% { transform: translate(28px, 15px); }
        52.8571% { transform: translate(27px, 17px); }
        65.7143% { transform: translate(27px, 16px); }
        81.4286%, 100% { transform: translate(29px, 20px); }
      }
      /* already covered by the window here; keeps the end state invisible */
      @keyframes vis {
        0%, 89.2857% { opacity: 1; }
        92.8571%, 100% { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
    <g id="shadow">
      <path fill="#000000" fill-opacity="0.3" d="M5 30h20v1h-20z"/>
      <path fill="#000000" fill-opacity="0.15" d="M8 31h14v1h-14z"/>
    </g>
    <!-- round body: white left, cherry crescent right, tonal 1 px outline, light top/left -->
    <g id="cloud">
      <path fill="#5E4B5A" d="M2 8h1v1h-1zM2 9h1v1h-1zM1 10h1v1h-1zM1 11h1v1h-1zM1 12h1v1h-1zM1 13h1v1h-1zM1 14h1v1h-1zM1 15h1v1h-1zM1 16h1v1h-1zM1 17h1v1h-1zM1 18h1v1h-1zM1 19h1v1h-1zM1 20h1v1h-1zM2 21h1v1h-1zM2 22h1v1h-1zM3 23h1v1h-1zM4 24h1v1h-1zM5 25h1v1h-1zM6 26h2v1h-2zM8 27h2v1h-2zM10 28h4v1h-4zM16 28h2v1h-2zM14 29h2v1h-2z"/>
      <path fill="#7C1E2B" d="M14 1h2v1h-2zM10 2h4v1h-4zM16 2h4v1h-4zM8 3h2v1h-2zM20 3h2v1h-2zM6 4h2v1h-2zM22 4h2v1h-2zM5 5h1v1h-1zM24 5h1v1h-1zM4 6h1v1h-1zM25 6h1v1h-1zM3 7h1v1h-1zM26 7h1v1h-1zM27 8h1v1h-1zM27 9h1v1h-1zM28 10h1v1h-1zM28 11h1v1h-1zM28 12h1v1h-1zM28 13h1v1h-1zM28 14h1v1h-1zM28 15h1v1h-1zM28 16h1v1h-1zM28 17h1v1h-1zM28 18h1v1h-1zM28 19h1v1h-1zM28 20h1v1h-1zM27 21h1v1h-1zM27 22h1v1h-1zM26 23h1v1h-1zM25 24h1v1h-1zM24 25h1v1h-1zM22 26h2v1h-2zM20 27h2v1h-2zM18 28h2v1h-2z"/>
      <path fill="#FFFFFF" d="M4 7h1v1h-1zM3 8h1v1h-1zM3 9h1v1h-1zM2 10h1v1h-1zM2 11h1v1h-1zM2 12h1v1h-1zM2 13h1v1h-1zM2 14h1v1h-1zM2 15h1v1h-1zM2 16h1v1h-1zM2 17h1v1h-1zM2 18h1v1h-1z"/>
      <path fill="#F2848D" d="M14 2h1v1h-1zM10 3h4v1h-4zM16 3h3v1h-3zM8 4h2v1h-2zM20 4h1v1h-1zM6 5h2v1h-2zM22 5h1v1h-1zM5 6h1v1h-1z"/>
      <path fill="#F6F1F0" d="M6 6h8v1h-8zM5 7h12v1h-12zM4 8h14v1h-14zM4 9h15v1h-15zM3 10h17v1h-17zM3 11h18v1h-18zM3 12h18v1h-18zM3 13h19v1h-19zM3 14h19v1h-19zM3 15h20v1h-20zM3 16h20v1h-20zM3 17h20v1h-20zM3 18h20v1h-20zM3 19h20v1h-20zM3 20h20v1h-20zM4 21h18v1h-18zM5 22h17v1h-17zM6 23h16v1h-16zM8 24h13v1h-13zM10 25h10v1h-10zM14 26h2v1h-2z"/>
      <path fill="#DE4553" d="M14 3h2v1h-2zM10 4h10v1h-10zM8 5h14v1h-14zM14 6h10v1h-10zM17 7h8v1h-8zM18 8h8v1h-8zM19 9h7v1h-7zM20 10h7v1h-7zM21 11h6v1h-6zM21 12h6v1h-6zM22 13h5v1h-5zM22 14h5v1h-5zM23 15h4v1h-4zM23 16h4v1h-4zM23 17h4v1h-4zM23 18h4v1h-4zM23 19h4v1h-4zM23 20h4v1h-4zM22 21h4v1h-4zM22 22h3v1h-3zM22 23h2v1h-2zM21 24h1v1h-1z"/>
      <path fill="#D9CDD2" d="M2 19h1v1h-1zM2 20h1v1h-1zM3 21h1v1h-1zM3 22h2v1h-2zM4 23h2v1h-2zM5 24h3v1h-3zM6 25h4v1h-4zM20 25h1v1h-1zM8 26h6v1h-6zM16 26h4v1h-4zM10 27h9v1h-9zM14 28h2v1h-2z"/>
      <path fill="#B32F40" d="M15 2h1v1h-1zM19 3h1v1h-1zM21 4h1v1h-1zM23 5h1v1h-1zM24 6h1v1h-1zM25 7h1v1h-1zM26 8h1v1h-1zM26 9h1v1h-1zM27 10h1v1h-1zM27 11h1v1h-1zM27 12h1v1h-1zM27 13h1v1h-1zM27 14h1v1h-1zM27 15h1v1h-1zM27 16h1v1h-1zM27 17h1v1h-1zM27 18h1v1h-1zM27 19h1v1h-1zM27 20h1v1h-1zM26 21h1v1h-1zM25 22h2v1h-2zM24 23h2v1h-2zM22 24h3v1h-3zM21 25h3v1h-3zM20 26h2v1h-2zM19 27h1v1h-1z"/>
    </g>
    <g id="eye-rings"><path fill="#DE4553" d="M6 14h5v1h-5zM5 15h1v1h-1zM11 15h1v1h-1zM5 16h1v1h-1zM11 16h1v1h-1zM5 17h1v1h-1zM11 17h1v1h-1zM5 18h1v1h-1zM11 18h1v1h-1zM5 19h1v1h-1zM11 19h1v1h-1zM5 20h1v1h-1zM11 20h1v1h-1zM6 21h5v1h-5z"/><path fill="#2A1A22" d="M6 15h5v1h-5zM6 16h5v1h-5zM6 17h5v1h-5zM6 18h5v1h-5zM6 19h5v1h-5zM6 20h5v1h-5z"/><path fill="#B9AAB2" d="M18 14h5v1h-5zM17 15h1v1h-1zM23 15h1v1h-1zM17 16h1v1h-1zM23 16h1v1h-1zM17 17h1v1h-1zM23 17h1v1h-1zM17 18h1v1h-1zM23 18h1v1h-1zM17 19h1v1h-1zM23 19h1v1h-1zM17 20h1v1h-1zM23 20h1v1h-1zM18 21h5v1h-5z"/><path fill="#2A1A22" d="M18 15h5v1h-5zM18 16h5v1h-5zM18 17h5v1h-5zM18 18h5v1h-5zM18 19h5v1h-5zM18 20h5v1h-5z"/><path fill="#B9AAB2" d="M12 12h5v1h-5zM11 13h1v1h-1zM17 13h1v1h-1zM11 14h1v1h-1zM17 14h1v1h-1zM11 15h1v1h-1zM17 15h1v1h-1zM11 16h1v1h-1zM17 16h1v1h-1zM11 17h1v1h-1zM17 17h1v1h-1zM11 18h1v1h-1zM17 18h1v1h-1zM12 19h5v1h-5z"/><path fill="#2A1A22" d="M12 13h5v1h-5zM12 14h5v1h-5zM12 15h5v1h-5zM12 16h5v1h-5zM12 17h5v1h-5zM12 18h5v1h-5z"/></g>
    <g id="eyes-open"><path fill="#FFFFFF" d="M7 16h2v1h-2zM7 17h2v1h-2zM9 19h1v1h-1z"/><path fill="#FFFFFF" d="M19 16h2v1h-2zM19 17h2v1h-2zM21 19h1v1h-1z"/><path fill="#FFFFFF" d="M13 14h2v1h-2zM13 15h2v1h-2zM15 17h1v1h-1z"/></g>
    <g id="cursor"><path fill="#5A2433" d="M11 23h1v1h-1zM18 23h1v1h-1zM12 24h6v1h-6z"/><path fill="#FFFFFF" d="M13 25h1v1h-1zM16 25h1v1h-1z"/></g>
    <g id="hand"><path fill="#5E4B5A" d="M-1 -1h5v1h-5zM-2 0h1v1h-1zM4 0h1v1h-1zM-2 1h1v1h-1zM4 1h2v1h-2zM-2 2h1v1h-1zM3 2h1v1h-1zM5 2h1v1h-1zM-2 3h1v1h-1zM5 3h1v1h-1zM-2 4h1v1h-1zM4 4h1v1h-1zM-1 5h5v1h-5z"/><path fill="#F6F1F0" d="M-1 0h2v1h-2zM-1 1h4v1h-4zM0 2h3v1h-3zM0 3h4v1h-4zM1 4h3v1h-3z"/><path fill="#FFFFFF" d="M1 0h3v1h-3zM3 1h1v1h-1zM4 2h1v1h-1zM4 3h1v1h-1z"/><path fill="#D9CDD2" d="M-1 2h1v1h-1zM-1 3h1v1h-1zM-1 4h2v1h-2z"/></g>
    <g id="hand-r"><path fill="#7C1E2B" d="M0 -1h5v1h-5zM-1 0h1v1h-1zM5 0h1v1h-1zM-2 1h2v1h-2zM5 1h1v1h-1zM-2 2h1v1h-1zM0 2h1v1h-1zM5 2h1v1h-1zM-2 3h1v1h-1zM5 3h1v1h-1zM-1 4h1v1h-1zM5 4h1v1h-1zM0 5h5v1h-5z"/><path fill="#F2848D" d="M0 0h3v1h-3zM0 1h1v1h-1zM-1 2h1v1h-1zM-1 3h1v1h-1z"/><path fill="#DE4553" d="M3 0h2v1h-2zM1 1h4v1h-4zM1 2h3v1h-3zM0 3h4v1h-4zM0 4h3v1h-3z"/><path fill="#B32F40" d="M4 2h1v1h-1zM4 3h1v1h-1zM3 4h2v1h-2z"/></g>
  </defs>
  <g transform="scale(.5)" class="vis">
    <g class="x">
      <g class="shx"><use href="#shadow"/></g>
      <g class="y"><g class="sq">
        <use href="#cloud"/>
        <g class="fy">
          <use href="#eye-rings"/>
          <g class="look"><use href="#eyes-open"/></g>
          <use href="#cursor"/>
        </g>
        <g class="hands" opacity="0">
          <g class="hl" transform="translate(-1 19)"><use href="#hand"/></g>
          <g class="hr" transform="translate(26 19)"><use href="#hand-r"/></g>
        </g>
      </g></g>
    </g>
  </g>
</svg>
