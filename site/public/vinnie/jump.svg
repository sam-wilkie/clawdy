<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <!-- Monster v2 jump: 350 ms once, fill forwards. Body language only (the page moves the box along the arc): crouch, launch stretch, airborne tuck with happy face, landing squash, settle overshoot, ends on the idle resting pose. Squash/stretch scales the rig about the feet (15, 30) with eased keyframes; eye and face swaps are step-end. -->
  <defs>
    <style>
      .rig, .shx { transform-box: view-box; transform-origin: 15px 30px; }
      .rig { animation: rig 350ms linear 1 forwards; }
      .shx { animation: shx 350ms linear 1 forwards; }
      .look { animation: look 350ms step-end 1 forwards; }
      .face-n { animation: face-n 350ms step-end 1 forwards; }
      .face-h { animation: face-h 350ms step-end 1 forwards; }
      .hands { animation: hands 350ms step-end 1 forwards; }
      .hl { animation: hl 350ms linear 1 forwards; }
      .hr { animation: hr 350ms linear 1 forwards; }
      @keyframes rig {
        0.0000% { transform: scale(1, 1); animation-timing-function: ease-out; }
        17.1429% { transform: scale(1.08, 0.88); animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
        37.1429% { transform: scale(0.92, 1.12); animation-timing-function: ease-in-out; }
        68.5714% { transform: scale(0.98, 1.02); animation-timing-function: ease-out; }
        77.1429% { transform: scale(1.1, 0.86); animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
        88.5714% { transform: scale(0.97, 1.04); animation-timing-function: ease-in-out; }
        100.0000% { transform: scale(1, 1); }
      }
      @keyframes shx {
        0.0000% { transform: scale(1, 1); opacity: 1; animation-timing-function: ease-out; }
        17.1429% { transform: scale(1.08, 1); opacity: 1; animation-timing-function: ease-in; }
        37.1429% { transform: scale(0.85, 1); opacity: 0.5; animation-timing-function: ease-in-out; }
        68.5714% { transform: scale(0.95, 1); opacity: 0.8; animation-timing-function: ease-out; }
        77.1429% { transform: scale(1.12, 1); opacity: 1; animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
        88.5714% { transform: scale(0.98, 1); opacity: 1; animation-timing-function: ease-in-out; }
        100.0000% { transform: scale(1, 1); opacity: 1; }
      }
      @keyframes look {
        0.0000% { transform: translate(1px, 0px); }
        25.7143% { transform: translate(1px, -1px); }
        68.5714% { transform: translate(0px, 0px); }
        100.0000% { transform: translate(0px, 0px); }
      }
      @keyframes face-n {
        0.0000% { opacity: 1; }
        40.0000% { opacity: 0; }
        68.5714% { opacity: 1; }
        100.0000% { opacity: 1; }
      }
      @keyframes face-h {
        0.0000% { opacity: 0; }
        40.0000% { opacity: 1; }
        68.5714% { opacity: 0; }
        100.0000% { opacity: 0; }
      }
      @keyframes hands {
        0.0000% { opacity: 1; }
        94.2857% { opacity: 0; }
        100.0000% { opacity: 0; }
      }
      @keyframes hl {
        0.0000% { transform: translate(-1px, 19px); animation-timing-function: ease-out; }
        17.1429% { transform: translate(0px, 21px); animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
        37.1429% { transform: translate(-3px, 12px); animation-timing-function: ease-out; }
        68.5714% { transform: translate(-3px, 13px); animation-timing-function: ease-in; }
        77.1429% { transform: translate(0px, 21px); animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
        88.5714% { transform: translate(-1px, 19px); }
        100.0000% { transform: translate(-1px, 19px); }
      }
      @keyframes hr {
        0.0000% { transform: translate(26px, 19px); animation-timing-function: ease-out; }
        17.1429% { transform: translate(25px, 21px); animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
        37.1429% { transform: translate(28px, 12px); animation-timing-function: ease-out; }
        68.5714% { transform: translate(28px, 13px); animation-timing-function: ease-in; }
        77.1429% { transform: translate(25px, 21px); animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
        88.5714% { transform: translate(26px, 19px); }
        100.0000% { transform: translate(26px, 19px); }
      }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
    <g id="shadow">
      <path fill="#000000" fill-opacity="0.3" d="M5 30h20v1h-20z"/>
      <path fill="#000000" fill-opacity="0.15" d="M8 31h14v1h-14z"/>
    </g>
