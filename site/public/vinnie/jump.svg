  <g transform="scale(.5)">
    <g class="shx"><use href="#shadow"/></g>
    <g class="rig">
      <use href="#cloud"/>
      <g class="face-n">
        <use href="#eye-rings"/>
        <g class="look"><use href="#eyes-open"/></g>
        <use href="#cursor"/>
      </g>
      <g class="face-h" opacity="0"><use href="#face-happy"/></g>
      <g class="hands">
        <g class="hl" transform="translate(-1 19)"><use href="#hand"/></g>
        <g class="hr" transform="translate(26 19)"><use href="#hand-r"/></g>
      </g>
    </g>
