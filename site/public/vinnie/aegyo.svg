<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <!-- Monster v2 aegyo: 3.2 s loop, all motion continuous on eased tracks. Starts at the idle rest pose, dips into a bashful sway about the feet with a small squash, mittens tuck in to the chest and wiggle out of phase, the face crossfades to shy ^ ^ eyes with blush, blinks into big pleading eyes (looking up) mid-loop, then everything relaxes back to rest. Four pixel hearts rise from above the head, staggered so one or two are always in the air. -->
  <defs>
    <style>
      .b, .sh { transform-box: view-box; transform-origin: 15px 30px; animation: b 3.2s ease-in-out infinite; }
      .sh { animation-name: sh; }
      .tl, .hl, .hr, .rs, .ps, .sf, .h { transform-box: fill-box; transform-origin: 50% 50%; }
      .tl { animation: tl 3.2s ease-in-out infinite; }
      .hl { animation: hl 3.2s ease-in-out infinite; }
      .hr { animation: hr 3.2s ease-in-out infinite; }
      .ro { animation: ro 3.2s ease-in-out infinite; }
      .rs { animation: rs 3.2s ease-in-out infinite; }
      .sf { opacity: 0; animation: sf 3.2s ease-in-out infinite; }
      .po { opacity: 0; animation: po 3.2s ease-in-out infinite; }
      .ps { animation: ps 3.2s ease-in-out infinite; }
      .bl { opacity: 0; animation: bl 3.2s ease-in-out infinite; }
      .h { opacity: 0; animation: h 3.2s ease-out infinite; }
      .h1 { animation-delay: -3s; }
      .h2 { animation-delay: -2.2s; }
      .h3 { animation-delay: -1.4s; animation-name: h-l; }
      .h4 { animation-delay: -.6s; }
      @keyframes b { 0%, 5%, 100% { translate: 0 0; rotate: 0deg; scale: 1 1; } 15% { translate: 0 1px; rotate: -2deg; scale: 1.03 .96; } 28% { translate: 0 .5px; rotate: -1deg; scale: 1.01 .98; } 45% { translate: 0 .8px; rotate: 1deg; scale: 1.02 .97; } 60% { translate: 0 .3px; rotate: .4deg; scale: 1 .99; } 78% { translate: 0 0; rotate: 0deg; scale: 1 1; } }
      @keyframes sh { 0%, 5%, 100% { scale: 1 1; } 15% { scale: 1.06 1; } 45% { scale: 1.04 1; } 78% { scale: 1 1; } }
      @keyframes tl { 0%, 5%, 100% { translate: 0 0; rotate: 0deg; } 15% { translate: -.5px .5px; rotate: -3deg; } 45% { translate: .5px .3px; rotate: 2deg; } 60% { translate: .3px 0; rotate: 1deg; } 78% { translate: 0 0; rotate: 0deg; } }
      @keyframes hl { 0%, 3%, 100% { translate: 0 0; rotate: 0deg; } 18% { translate: 5.6px .8px; rotate: 14deg; } 26% { translate: 5px 1.2px; rotate: 6deg; } 34% { translate: 5.6px .8px; rotate: 14deg; } 42% { translate: 5px 1.2px; rotate: 6deg; } 50% { translate: 5.6px .8px; rotate: 14deg; } 58% { translate: 5px 1.2px; rotate: 6deg; } 64% { translate: 5.3px 1px; rotate: 10deg; } 84% { translate: 0 0; rotate: 0deg; } }
      @keyframes hr { 0%, 5%, 100% { translate: 0 0; rotate: 0deg; } 20% { translate: -5px 1.2px; rotate: -6deg; } 28% { translate: -5.6px .8px; rotate: -14deg; } 36% { translate: -5px 1.2px; rotate: -6deg; } 44% { translate: -5.6px .8px; rotate: -14deg; } 52% { translate: -5px 1.2px; rotate: -6deg; } 60% { translate: -5.6px .8px; rotate: -14deg; } 66% { translate: -5.3px 1px; rotate: -10deg; } 86% { translate: 0 0; rotate: 0deg; } }
      @keyframes ro { 0%, 6% { opacity: 1; } 12%, 82% { opacity: 0; } 90%, 100% { opacity: 1; } }
      @keyframes rs { 0%, 6% { scale: 1 1; } 12%, 82% { scale: 1 .3; } 90%, 100% { scale: 1 1; } }
      @keyframes sf { 0%, 6% { opacity: 0; scale: 1 .4; } 12%, 42% { opacity: 1; scale: 1 1; } 47%, 63% { opacity: 0; scale: 1 .4; } 68%, 82% { opacity: 1; scale: 1 1; } 88%, 100% { opacity: 0; scale: 1 .4; } }
      @keyframes po { 0%, 42% { opacity: 0; } 47%, 63% { opacity: 1; } 68%, 100% { opacity: 0; } }
      @keyframes ps { 0%, 42% { scale: 1 .4; } 47%, 63% { scale: 1.06 1.06; } 68%, 100% { scale: 1 .4; } }
      @keyframes bl { 0%, 6% { opacity: 0; } 12%, 82% { opacity: 1; } 88%, 100% { opacity: 0; } }
      @keyframes h { 0% { translate: 0 3px; scale: .4; opacity: 0; } 7% { translate: -1px -3px; scale: 1; opacity: 1; } 24% { translate: 1.5px -11px; scale: 1; opacity: 1; } 36% { translate: 3.5px -17px; scale: .9; opacity: .8; } 45%, 100% { translate: 5px -22px; scale: .75; opacity: 0; } }
      @keyframes h-l { 0% { translate: 0 3px; scale: .4; opacity: 0; } 7% { translate: 1px -3px; scale: 1; opacity: 1; } 24% { translate: -1px -11px; scale: 1; opacity: 1; } 36% { translate: -2.5px -17px; scale: .9; opacity: .8; } 45%, 100% { translate: -3.5px -22px; scale: .75; opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
    <g id="shadow">
      <path fill="#000000" fill-opacity="0.3" d="M5 30h20v1h-20z"/>
      <path fill="#000000" fill-opacity="0.15" d="M8 31h14v1h-14z"/>
    </g>
