<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <!-- Monster v2 drag: 0.8 s seamless loop while held by the pointer. Hung from the top-centre (15, 2): eased sway of +-4deg with a counter swing, pulled-up stretch that pulses twice per loop, squeezed-shut > < eyes with a gritted mouth and one wince squash per loop, mittens flail out of phase (left 0.4 s, right 0.8 s, wider), shadow shrunk and faded, trailing the body's lower edge. All motion continuous; no pose swaps. -->
  <defs>
    <style>
      .rig { transform-box: view-box; transform-origin: 15px 2px; animation: sway .8s ease-in-out infinite, pull .4s ease-in-out infinite; }
      .face { transform-box: view-box; transform-origin: 15px 18px; animation: wince .8s cubic-bezier(.3, 0, .2, 1) infinite; }
      .sh { transform-box: view-box; transform-origin: 15px 30px; animation: sh .8s ease-in-out infinite; }
      .hl { transform-box: fill-box; transform-origin: 100% 50%; animation: hl .4s ease-in-out infinite; }
      .hr { transform-box: fill-box; transform-origin: 0 50%; animation: hr .8s ease-in-out infinite; }
      @keyframes sway { 0%, 100% { rotate: -4deg; translate: -.6px 0; } 50% { rotate: 4deg; translate: .6px 0; } }
      @keyframes pull { 0%, 100% { scale: .97 1.05; } 50% { scale: .985 1.025; } }
      @keyframes wince { 0%, 30%, 70%, 100% { scale: 1 1; } 45% { scale: 1.06 .86; } }
      @keyframes sh { 0%, 100% { scale: .7 1; opacity: .6; translate: 1.3px 0; } 50% { scale: .66 1; opacity: .5; translate: -1.3px 0; } }
      @keyframes hl { 0%, 100% { rotate: 25deg; translate: -1px -2px; } 50% { rotate: -15deg; translate: 0 0; } }
      @keyframes hr { 0%, 100% { rotate: 20deg; translate: 0 1px; } 35% { rotate: -32deg; translate: 2px -2px; } 65% { rotate: 5deg; translate: 1px 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
    <g id="shadow">
      <path fill="#000000" fill-opacity="0.3" d="M5 30h20v1h-20z"/>
      <path fill="#000000" fill-opacity="0.15" d="M8 31h14v1h-14z"/>
    </g>
    <g id="cloud">
      <path fill="#5E4B5A" d="M2 8h1v1h-1zM2 9h1v1h-1zM1 10h1v1h-1zM1 11h1v1h-1zM1 12h1v1h-1zM1 13h1v1h-1zM1 14h1v1h-1zM1 15h1v1h-1zM1 16h1v1h-1zM1 17h1v1h-1zM1 18h1v1h-1zM1 19h1v1h-1zM1 20h1v1h-1zM2 21h1v1h-1zM2 22h1v1h-1zM3 23h1v1h-1zM4 24h1v1h-1zM5 25h1v1h-1zM6 26h2v1h-2zM8 27h2v1h-2zM10 28h4v1h-4zM16 28h2v1h-2zM14 29h2v1h-2z"/>
      <path fill="#7C1E2B" d="M14 1h2v1h-2zM10 2h4v1h-4zM16 2h4v1h-4zM8 3h2v1h-2zM20 3h2v1h-2zM6 4h2v1h-2zM22 4h2v1h-2zM5 5h1v1h-1zM24 5h1v1h-1zM4 6h1v1h-1zM25 6h1v1h-1zM3 7h1v1h-1zM26 7h1v1h-1zM27 8h1v1h-1zM27 9h1v1h-1zM28 10h1v1h-1zM28 11h1v1h-1zM28 12h1v1h-1zM28 13h1v1h-1zM28 14h1v1h-1zM28 15h1v1h-1zM28 16h1v1h-1zM28 17h1v1h-1zM28 18h1v1h-1zM28 19h1v1h-1zM28 20h1v1h-1zM27 21h1v1h-1zM27 22h1v1h-1zM26 23h1v1h-1zM25 24h1v1h-1zM24 25h1v1h-1zM22 26h2v1h-2zM20 27h2v1h-2zM18 28h2v1h-2z"/>
      <path fill="#FFFFFF" d="M4 7h1v1h-1zM3 8h1v1h-1zM3 9h1v1h-1zM2 10h1v1h-1zM2 11h1v1h-1zM2 12h1v1h-1zM2 13h1v1h-1zM2 14h1v1h-1zM2 15h1v1h-1zM2 16h1v1h-1zM2 17h1v1h-1zM2 18h1v1h-1z"/>
      <path fill="#F2848D" d="M14 2h1v1h-1zM10 3h4v1h-4zM16 3h3v1h-3zM8 4h2v1h-2zM20 4h1v1h-1zM6 5h2v1h-2zM22 5h1v1h-1zM5 6h1v1h-1z"/>
      <path fill="#F6F1F0" d="M6 6h8v1h-8zM5 7h12v1h-12zM4 8h14v1h-14zM4 9h15v1h-15zM3 10h17v1h-17zM3 11h18v1h-18zM3 12h18v1h-18zM3 13h19v1h-19zM3 14h19v1h-19zM3 15h20v1h-20zM3 16h20v1h-20zM3 17h20v1h-20zM3 18h20v1h-20zM3 19h20v1h-20zM3 20h20v1h-20zM4 21h18v1h-18zM5 22h17v1h-17zM6 23h16v1h-16zM8 24h13v1h-13zM10 25h10v1h-10zM14 26h2v1h-2z"/>
      <path fill="#DE4553" d="M14 3h2v1h-2zM10 4h10v1h-10zM8 5h14v1h-14zM14 6h10v1h-10zM17 7h8v1h-8zM18 8h8v1h-8zM19 9h7v1h-7zM20 10h7v1h-7zM21 11h6v1h-6zM21 12h6v1h-6zM22 13h5v1h-5zM22 14h5v1h-5zM23 15h4v1h-4zM23 16h4v1h-4zM23 17h4v1h-4zM23 18h4v1h-4zM23 19h4v1h-4zM23 20h4v1h-4zM22 21h4v1h-4zM22 22h3v1h-3zM22 23h2v1h-2zM21 24h1v1h-1z"/>
      <path fill="#D9CDD2" d="M2 19h1v1h-1zM2 20h1v1h-1zM3 21h1v1h-1zM3 22h2v1h-2zM4 23h2v1h-2zM5 24h3v1h-3zM6 25h4v1h-4zM20 25h1v1h-1zM8 26h6v1h-6zM16 26h4v1h-4zM10 27h9v1h-9zM14 28h2v1h-2z"/>
      <path fill="#B32F40" d="M15 2h1v1h-1zM19 3h1v1h-1zM21 4h1v1h-1zM23 5h1v1h-1zM24 6h1v1h-1zM25 7h1v1h-1zM26 8h1v1h-1zM26 9h1v1h-1zM27 10h1v1h-1zM27 11h1v1h-1zM27 12h1v1h-1zM27 13h1v1h-1zM27 14h1v1h-1zM27 15h1v1h-1zM27 16h1v1h-1zM27 17h1v1h-1zM27 18h1v1h-1zM27 19h1v1h-1zM27 20h1v1h-1zM26 21h1v1h-1zM25 22h2v1h-2zM24 23h2v1h-2zM22 24h3v1h-3zM21 25h3v1h-3zM20 26h2v1h-2zM19 27h1v1h-1z"/>
    </g>
    <!-- > < squeezed-shut eyes (2 px strokes) over the side eye sockets, a pressed line for the top eye, gritted open mouth -->
    <g id="face-squeeze">
      <path fill="#2A1A22" d="M6 15h2v1h-2zM7 16h2v1h-2zM8 17h2v1h-2zM9 18h2v1h-2zM8 19h2v1h-2zM7 20h2v1h-2zM6 21h2v1h-2z"/>
      <path fill="#2A1A22" d="M21 15h2v1h-2zM20 16h2v1h-2zM19 17h2v1h-2zM18 18h2v1h-2zM19 19h2v1h-2zM20 20h2v1h-2zM21 21h2v1h-2z"/>
      <path fill="#2A1A22" d="M12 15h5v1h-5zM13 16h3v1h-3z"/>
      <path fill="#5A2433" d="M13 23h4v1h-4zM12 24h1v1h-1zM17 24h1v1h-1zM13 25h4v1h-4z"/>
      <path fill="#5A0F1E" d="M13 24h4v1h-4z"/>
      <path fill="#FFFFFF" d="M14 24h1v1h-1z"/>
    </g>
    <g id="hand"><path fill="#5E4B5A" d="M-1 -1h5v1h-5zM-2 0h1v1h-1zM4 0h1v1h-1zM-2 1h1v1h-1zM4 1h2v1h-2zM-2 2h1v1h-1zM3 2h1v1h-1zM5 2h1v1h-1zM-2 3h1v1h-1zM5 3h1v1h-1zM-2 4h1v1h-1zM4 4h1v1h-1zM-1 5h5v1h-5z"/><path fill="#F6F1F0" d="M-1 0h2v1h-2zM-1 1h4v1h-4zM0 2h3v1h-3zM0 3h4v1h-4zM1 4h3v1h-3z"/><path fill="#FFFFFF" d="M1 0h3v1h-3zM3 1h1v1h-1zM4 2h1v1h-1zM4 3h1v1h-1z"/><path fill="#D9CDD2" d="M-1 2h1v1h-1zM-1 3h1v1h-1zM-1 4h2v1h-2z"/></g>
    <g id="hand-r"><path fill="#7C1E2B" d="M0 -1h5v1h-5zM-1 0h1v1h-1zM5 0h1v1h-1zM-2 1h2v1h-2zM5 1h1v1h-1zM-2 2h1v1h-1zM0 2h1v1h-1zM5 2h1v1h-1zM-2 3h1v1h-1zM5 3h1v1h-1zM-1 4h1v1h-1zM5 4h1v1h-1zM0 5h5v1h-5z"/><path fill="#F2848D" d="M0 0h3v1h-3zM0 1h1v1h-1zM-1 2h1v1h-1zM-1 3h1v1h-1z"/><path fill="#DE4553" d="M3 0h2v1h-2zM1 1h4v1h-4zM1 2h3v1h-3zM0 3h4v1h-4zM0 4h3v1h-3z"/><path fill="#B32F40" d="M4 2h1v1h-1zM4 3h1v1h-1zM3 4h2v1h-2z"/></g>
  </defs>
  <g transform="scale(.5)">
    <g class="sh"><use href="#shadow"/></g>
    <g class="rig">
      <use href="#cloud"/>
      <g class="face"><use href="#face-squeeze"/></g>
      <g transform="translate(-1 19)"><g class="hl"><use href="#hand"/></g></g>
      <g transform="translate(26 19)"><g class="hr"><use href="#hand-r"/></g></g>
    </g>
  </g>
</svg>
