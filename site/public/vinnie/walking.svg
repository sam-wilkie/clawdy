<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <!-- Monster v2 walking: 0.6 s loop, two strides, all motion continuous (no pose swaps). Floats sideways in place looking right: eased bob with squash/stretch about the feet, a 1 px lean per stride, the face trails the body by 40 ms, mittens swing fore and aft out of phase, a puff trails off behind each footfall. -->
  <defs>
    <style>
      .b, .f, .sh { transform-box: view-box; transform-origin: 15px 30px; animation: b .3s ease-in-out infinite; }
      .f { animation-delay: -.26s; }
      .sh { animation-name: sh; }
      .ln { animation: ln .6s ease-in-out infinite; }
      .hl, .hr { transform-box: fill-box; transform-origin: 100% 50%; animation: sw .6s ease-in-out infinite; }
      .hr { transform-origin: 0 50%; animation-delay: -.5s; }
      .t { transform-box: fill-box; transform-origin: 50% 50%; animation: t .6s ease-out infinite; }
      .t + .t { animation-delay: -.3s; }
      @keyframes b { 0%, 100% { translate: 0 0; scale: 1.03 .97; } 50% { translate: 0 -1px; scale: .98 1.02; } }
      @keyframes sh { 0%, 100% { scale: 1 1; opacity: 1; } 50% { scale: .85 1; opacity: .7; } }
      @keyframes ln { 0%, 100% { translate: -.5px 0; } 50% { translate: .5px 0; } }
      @keyframes sw { 0%, 100% { translate: -1.7px 0; rotate: -12deg; } 50% { translate: 1.7px 0; rotate: 12deg; } }
      @keyframes t { 0% { translate: -6px 22px; scale: .5; opacity: 0; } 15% { scale: 1; opacity: 1; } 100% { translate: -14px 18px; scale: .3; opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
    <g id="shadow">
      <path fill="#000000" fill-opacity="0.3" d="M5 30h20v1h-20z"/>
      <path fill="#000000" fill-opacity="0.15" d="M8 31h14v1h-14z"/>
    </g>
