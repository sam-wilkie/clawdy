<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  
  <!-- Monster v2 thinking: the Claude crab's clawd-working-thinking-v2.svg (same scene and timing) with the monster's body, eyes and mittens. -->
  <defs>
    <style>
      .dot0 { animation: dot0 4s infinite step-end; }
      .dot1 { animation: dot1 4s infinite step-end; }
      .dot2 { animation: dot2 4s infinite step-end; }
      .ar-r { animation: ar-r 4s infinite step-end; }
      .ey-open { animation: ey-open 4s infinite step-end; }
      .ey-shut { animation: ey-shut 4s infinite step-end; }
      .ey-look { animation: ey-look 4s infinite step-end; }
      .leg1 { animation: leg1 4s infinite step-end; }
      .leg2 { animation: leg2 4s infinite step-end; }
      .leg3 { animation: leg3 4s infinite step-end; }
      .leg4 { animation: leg4 4s infinite step-end; }
      .sway { animation: sway 4s infinite step-end; }
      @keyframes dot0 {
        0% { opacity: 0; }
        10.9375% { opacity: 1; }
        48.4375% { opacity: 0; }
        60.9375% { opacity: 1; }
      }
      @keyframes dot1 {
        0% { opacity: 0; }
        20.3125% { opacity: 1; }
        48.4375% { opacity: 0; }
        70.3125% { opacity: 1; }
      }
      @keyframes dot2 {
        0% { opacity: 0; }
        29.6875% { opacity: 1; }
        48.4375% { opacity: 0; }
        79.6875% { opacity: 1; }
      }
      @keyframes ar-r {
        0% { transform: translate(-5px, 4px); }
        10.9375% { transform: translate(-5px, 3px); }
        23.4375% { transform: translate(-5px, 4px); }
        35.9375% { transform: translate(-5px, 3px); }
        48.4375% { transform: translate(-5px, 4px); }
        60.9375% { transform: translate(-5px, 3px); }
        73.4375% { transform: translate(-5px, 4px); }
        85.9375% { transform: translate(-5px, 3px); }
      }
      @keyframes ey-open {
        0% { opacity: 1; }
        45.3125% { opacity: 0; }
        51.5625% { opacity: 1; }
      }
      @keyframes ey-shut {
        0% { opacity: 0; }
        45.3125% { opacity: 1; }
        51.5625% { opacity: 0; }
      }
      @keyframes ey-look {
        0% { transform: translate(2px, -1px); }
      }
      @keyframes leg1 {
        0% { transform: translate(0px, 0px); }
        17.1875% { transform: translate(-1px, 0px); }
        35.9375% { transform: translate(0px, 0px); }
        64.0625% { transform: translate(1px, 0px); }
        82.8125% { transform: translate(0px, 0px); }
      }
      @keyframes leg2 {
        0% { transform: translate(0px, 0px); }
        17.1875% { transform: translate(-1px, 0px); }
        35.9375% { transform: translate(0px, 0px); }
        64.0625% { transform: translate(1px, 0px); }
        82.8125% { transform: translate(0px, 0px); }
      }
      @keyframes leg3 {
        0% { transform: translate(0px, 0px); }
        17.1875% { transform: translate(-1px, 0px); }
        35.9375% { transform: translate(0px, 0px); }
        64.0625% { transform: translate(1px, 0px); }
        82.8125% { transform: translate(0px, 0px); }
      }
      @keyframes leg4 {
        0% { transform: translate(0px, 0px); }
        17.1875% { transform: translate(-1px, 0px); }
        35.9375% { transform: translate(0px, 0px); }
        64.0625% { transform: translate(1px, 0px); }
        82.8125% { transform: translate(0px, 0px); }
      }
      @keyframes sway {
        0% { transform: translate(0px, 0px); }
        7.8125% { transform: translate(-1px, 0px); }
        17.1875% { transform: translate(-2px, 0px); }
        35.9375% { transform: translate(-1px, 0px); }
        45.3125% { transform: translate(0px, 0px); }
        54.6875% { transform: translate(1px, 0px); }
        64.0625% { transform: translate(2px, 0px); }
        82.8125% { transform: translate(1px, 0px); }
        92.1875% { transform: translate(0px, 0px); }
      }
    </style>
    <!-- ===== rig: shared Clawd v2 parts, identical in every clawd-*-v2.svg (see clawd-static-base-v2.svg) ===== -->
