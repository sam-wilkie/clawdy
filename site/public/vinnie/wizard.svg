<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  
  <!-- Monster v2 wizard: the Claude crab's clawd-wizard-v2.svg (same scene and timing) with the monster's body, eyes and mittens. -->
  <defs>
    <style>
      .bob   { animation: bob 2.4s ease-in-out infinite; }
      .wave  { transform-box: fill-box; transform-origin: 0% 100%; animation: wave 1.2s ease-in-out infinite; }
      .spk   { animation: spk 2.4s ease-out infinite; }
      .k2 { animation-delay: -0.6s; } .k3 { animation-delay: -1.2s; } .k4 { animation-delay: -1.8s; }
      .ey-open { animation: ey-open 2.4s steps(1) infinite; }
      .ey-shut { animation: ey-shut 2.4s steps(1) infinite; }

      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1px); } }
      @keyframes wave {
        0%, 100% { transform: rotate(-18deg); }
        50%      { transform: rotate(14deg); }
      }
      @keyframes spk {
        0%   { transform: translate(0, 0) scale(0.4); opacity: 0; }
        12%  { transform: translate(1px, -2px) scale(1); opacity: 1; }
        100% { transform: translate(4px, -18px) scale(0.6); opacity: 0; }
      }
      @keyframes ey-open { 0% { opacity: 0; } 40% { opacity: 1; } 70% { opacity: 0; } }
      @keyframes ey-shut { 0% { opacity: 1; } 40% { opacity: 0; } 70% { opacity: 1; } }
    </style>

    <!-- ===== v2 rig ===== -->
    <g id="leg1"></g>
    <g id="leg2"></g>
    <g id="leg3"></g>
    <g id="leg4"></g>
