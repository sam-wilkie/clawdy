<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  
  <!-- Monster v2 cool: the Claude crab's clawd-cool-v2.svg (same scene and timing) with the monster's body, eyes and mittens. -->
  <defs>
    <style>
      .tilt   { transform-box: fill-box; transform-origin: 50% 100%; animation: tilt 5s ease-in-out infinite; }
      .arm-r  { transform-box: fill-box; transform-origin: 0% 50%;   animation: arm-r 5s ease-in-out infinite; }
      .arm-l  { transform-box: fill-box; transform-origin: 100% 50%; animation: arm-l 5s ease-in-out infinite; }
      .shades { transform-box: fill-box; transform-origin: 50% 50%;  animation: shades 5s ease-in-out infinite; }
      .spark  { transform-box: fill-box; transform-origin: 50% 50%;  animation: spark 5s ease-out infinite; }

      @keyframes tilt {
        0%, 42%  { transform: rotate(0deg); }
        46%      { transform: rotate(2deg); }
        50%      { transform: rotate(-2deg); }
        54%      { transform: rotate(0deg); }
        60%, 88% { transform: rotate(2deg); }
        96%, 100%{ transform: rotate(0deg); }
      }
      /* right pincer: rest -> raised (summons the shades) -> back -> cool pose out */
      @keyframes arm-r {
        0%, 8%   { transform: translate(0, 0) rotate(0deg); }
        14%, 30% { transform: translate(-1px, -6px) rotate(-80deg); }
        40%, 54% { transform: translate(0, 0) rotate(0deg); }
        60%, 88% { transform: translate(1px, 1px) rotate(0deg); }
        96%, 100%{ transform: translate(0, 0) rotate(0deg); }
      }
      @keyframes arm-l {
        0%, 54%  { transform: translate(0, 0) rotate(0deg); }
        60%, 88% { transform: translate(-1px, 1px) rotate(0deg); }
        96%, 100%{ transform: translate(0, 0) rotate(0deg); }
      }
      /* shades: hidden -> pop in small over the raised pincer -> fly to the face -> hold -> fade */
      @keyframes shades {
        0%, 16%  { transform: translate(11px, -9px) scale(0.3); opacity: 0; }
        22%, 30% { transform: translate(11px, -9px) scale(0.4); opacity: 1; }
        42%      { transform: translate(0, 1px) scale(1.05); opacity: 1; }
        46%, 88% { transform: translate(0, 0) scale(1); opacity: 1; }
        96%, 100%{ transform: translate(0, -3px) scale(1); opacity: 0; }
      }
      @keyframes spark {
        0%, 55%  { transform: scale(0.4); opacity: 0; }
        59%      { transform: scale(1.3); opacity: 1; }
        64%      { transform: scale(0.9); opacity: 0.8; }
        70%, 100%{ transform: scale(0.4); opacity: 0; }
      }
    </style>

    <!-- ===== v2 rig ===== -->
    <g id="leg1"></g>
    <g id="leg2"></g>
    <g id="leg3"></g>
    <g id="leg4"></g>
